<app-stat-card
  heading="Cerințele de business acum"
  question="Sunt respectate cele 4 promisiuni ale sistemului?"
  [state]="result().state"
  [error]="errorOf()"
  [interpretation]="interpretation()"
>
  <div class="tiles">
    @for (r of tiles(); track r.id) {
      <div class="tile" [class]="tone(r)">
        <div class="tile-head">
          <span class="status">{{ tone(r) === 'green' ? '● Îndeplinită' : '● În pericol' }}</span>
          <span class="id">{{ r.id }} · {{ labels[r.category] }}</span>
        </div>
        <strong>{{ r.title }}</strong>
        <p>{{ r.message }}</p>
      </div>
    }
  </div>
</app-stat-card>

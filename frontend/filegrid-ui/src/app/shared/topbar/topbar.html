<header class="topbar">
  <a routerLink="/" class="brand" aria-label="FileGrid, pagina principală"><app-logo /></a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Acasă</a>
    @if (canUpload()) {
      <a routerLink="/upload" routerLinkActive="active">Încărcare</a>
    }
    @if (canSearch()) {
      <a routerLink="/search" routerLinkActive="active">Căutare</a>
    }
    @if (canViewStats()) {
      <a routerLink="/stats" routerLinkActive="active">Statistici</a>
    }
  </nav>
  @if (auth.user(); as user) {
    <span class="user">
      {{ user.username }}
      @if (user.role) {
        <span class="role" [attr.title]="user.role">{{ roleLabel(user.role) }}</span>
      }
    </span>
  }
  <button type="button" class="secondary" (click)="auth.logout()">Ieșire</button>
</header>

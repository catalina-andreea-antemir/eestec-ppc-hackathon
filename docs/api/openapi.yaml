  /uploads/{id}/chunks/{n}:
    put:
      tags: [Upload în bucăți]
      operationId: putChunk
      summary: Trimite o bucată (corp binar, strict secvențial)
      description: |
        `n` pornește de la 1 și se trimite strict secvențial: `n` = următorul așteptat (`nextChunk`), altfel `409`
        `CHUNK_OUT_OF_ORDER`. Toate bucățile au exact `chunkSize` octeți, cu excepția ultimei (mai mică). Corpul se
        scrie în streaming, fără buffer de dimensiunea lui. Hash-ul SHA-256 al bucății se calculează la primire și
        se întoarce în `ChunkAck`.

        **Retrimiterea aceleiași bucăți este sigură**: o bucată deja primită se confirmă idempotent (`200`,
        `duplicate: true`). Dacă altă cerere scrie în același moment aceeași sesiune (lease per upload), răspunsul
        este `409` `UPLOAD_BUSY` cu `Retry-After`. Storage-ul sesiunii indisponibil: `503` cu `Retry-After`.
        Clientul reîncearcă cu backoff exponențial până la un timeout de 2 minute.
      x-roles: [FIELD, ADMIN]
      x-metrics: [filegrid_operation_seconds, filegrid_operation_errors_total, filegrid_transfers_failed_total, filegrid_bulkhead_rejected_total]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: n
          in: path
          required: true
          description: Numărul bucății, de la 1.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Bucată primită (sau deja primită, confirmată idempotent).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkAck'
              example:
                n: 36
                size: 16777216
                sha256: ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d
                nextChunk: 37
                duplicate: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `CHUNK_OUT_OF_ORDER` (n diferit de `nextChunk`), `UPLOAD_BUSY` (lease ocupat de altă cerere, cu `Retry-After`) sau
            `UPLOAD_NOT_ACTIVE` (sesiune încheiată, anulată sau abandonată).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outOfOrder:
                  summary: Bucată în afara ordinii
                  value:
                    status: 409
                    code: CHUNK_OUT_OF_ORDER
                    message: Se aștepta bucata 36, s-a primit 38.
                    traceId: 5a3e91c7d0b24f68a1c4e7b92d08f3a5
                    details:
                      expectedChunk: 36
                      receivedChunk: 38
                busy:
                  summary: Lease ocupat de altă cerere
                  value:
                    status: 409
                    code: UPLOAD_BUSY
                    message: Altă cerere scrie în acest moment în aceeași sesiune; reîncearcă.
                    traceId: 9e1b6f40c7d34a85b2e8d1f60a3c7b92
                    retryAfterSeconds: 1
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

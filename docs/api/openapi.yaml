openapi: 3.0.3
info:
  title: FileGrid PPC API
  version: 1.0.0
  description: |
    Contractul comun al FileGrid PPC (secțiunile 4, 4.1, 4.2, 4.3 și 4.4 din `docs/Impartirea-taskurilor-FileGrid.pdf`, v4).
    Autor: Catalina (C2). De confirmat de: Ovidiu, Flavius. De la confirmare, contractul se schimbă doar cu acordul tuturor.

    ## Convenții generale
    * Toate căile de mai jos sunt relative la `/api/v1`. Din exterior, singura intrare este nginx, pe HTTPS
      (`https://localhost`); portul 80 redirecționează la HTTPS. `/actuator` nu este expus de nginx.
    * Autentificare: `Authorization: Bearer <accessToken>` (JWT, 15 minute). Excepții, fără token: `GET /health`,
      `POST /auth/login`, `POST /auth/refresh` și `GET /downloads/{token}` (token-ul semnat din URL este autorizarea).
    * Roluri: `DISPATCH`, `FIELD`, `CONNECTIONS`, `METER_SERVICE`, `ADMIN`. Fiecare operație are `x-roles`; matricea
      completă pe categorii este în `components.x-role-matrix` și în descrierea schemei `Role`.
    * Fiecare răspuns (și cele de eroare) poartă header-ul `X-Trace-Id`; același identificator apare în loguri (Loki)
      și permite urmărirea operației de la cerere până la storage.
    * Toate momentele sunt ISO-8601 UTC (`2026-11-14T06:00:00Z`).
    * Erorile au mereu formatul `Error` (JSON), cu un câmp `code` stabil, pe care clienții îl pot testa.
    * `429` și `503` poartă header-ul `Retry-After` (secunde); clientul reîncearcă cu aceeași cheie / aceeași bucată.
    * Metricile Prometheus au nume fixe (secțiunea 4.3), listate în `components.x-metrics`.

    ## Puncte propuse, de confirmat (Ovidiu, Flavius)
    Planul v4 nu fixează aceste detalii; sunt propuse aici ca să existe un contract complet. Dacă nu se confirmă,
    se schimbă doar în acest fișier.

    1. **Format `Idempotency-Key`**: `meterId + "_" + ts` al primei citiri (exact ca în corp), de exemplu
       `RO-MUN-0004821_2026-11-14T00:00:00Z`. Serverul compară șirul întreg, nu îl parsează.
    2. **429 vs 503**: `429` când bulkhead-ul categoriei e saturat (limită din politică); `503` când un storage /
       FileGridMeta e indisponibil sau un lot e în curs de procesare. Ambele cu `Retry-After`.
    3. **Coduri 409** (câmpul `code`): `FILE_CORRUPT`, `BATCH_OVERLAP`, `CHUNK_OUT_OF_ORDER`, `UPLOAD_BUSY`
       (lease ocupat, cu `Retry-After`), `UPLOAD_INCOMPLETE` (complete înainte de toate bucățile),
       `UPLOAD_NOT_ACTIVE` (sesiune încheiată, anulată sau abandonată).
    4. **Coduri în plus față de lista din plan**: `404` (resursă inexistentă), `413` (peste mărimea maximă din
       politică), `416` (Range invalid).
    5. **`POST /files`** acceptă doar `OUTAGE_RECORD` și `CONNECTION_DOC` (fișiere mici, până la 20 MB);
       **`POST /uploads`** acceptă doar `INSPECTION_VIDEO` (singura categorie cu `chunkSize` în 4.2).
       `METER_READING` intră doar prin `POST /meter-readings`.
    6. **`GET /files`**: paginare cu `page` (de la 1) și `size` (implicit 20, maxim 100); `from`/`to` filtrează
       `createdAt`. Fără `category`, rezultatele se restrâng la categoriile permise rolului; cu o categorie
       nepermisă răspunsul e `403`.
    7. **Hash la descărcare**: `X-Content-SHA256` este hash-ul bytes-ilor trimiși (la `CONNECTION_DOC`, care se
       descarcă decriptat, este `sha256Plain`). `/verify` fără `deep` compară `sha256` (bytes-ii stocați).
    8. **Link expirat sau invalid** la `GET /downloads/{token}`: `401`.
    9. **Claim JWT** pentru rol: `role` (un singur șir) și, cu aceeași valoare, `roles` (listă cu un element), pe care
       le citește interfața Angular; subiectul este `sub` (numele de utilizator). Detalii la `POST /auth/login`.
    10. **`POST /admin/benchmark/run`** este sincron (răspunde `200` cu rezultatele celor 12 combinații; timeout nginx
        300 s), fără corp.
    11. **`X-Scenario`**: șir liber (`^[a-z0-9_-]{1,32}$`), valori așteptate `normal`, `peak`, `storm`; benchmark-ul
        folosește `benchmark`.
    12. **Formele JSON ale `/stats/*`** (planul fixează doar numele endpoint-urilor și faptul că fiecare răspuns are
        o propoziție de interpretare în română, în câmpul `interpretation`).
    13. **Valorile etichetelor de metrici** `operation`, `outcome`, `error` (vezi `x-metrics`).
  contact:
    name: Catalina (lead tehnic)
servers:
  - url: https://localhost/api/v1
    description: Din exterior, prin nginx (TLS self-signed, generat la prima pornire)
  - url: http://api:8080/api/v1
    description: Doar pe rețeaua internă storage-net (folosit de meter-simulator, fără nginx)
tags:
  - name: Sistem
    description: Health fără autentificare.
  - name: Autentificare
    description: Login și reînnoirea token-ului.
  - name: Citiri contoare
    description: Loturi de citiri, idempotente.
  - name: Fișiere
    description: Upload fișier mic, căutare, detalii, verificare.
  - name: Upload în bucăți
    description: Upload cu reluare pentru fișiere mari (video).
  - name: Descărcare
    description: Descărcare directă și prin link semnat.
  - name: Statistici
    description: Statistici și interpretări pentru decizie (secțiunea 5 din cerință).
  - name: Administrare
    description: Benchmark și health per storage (doar ADMIN).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Sistem]
      operationId: getHealth
      summary: Health simplu (api și FileGridMeta)
      description: |
        Fără autentificare. Răspunde `{"status":"UP"}` doar când api și FileGridMeta răspund; altfel `503` cu
        `{"status":"DOWN"}`. Folosit de scriptul de start și de healthcheck-ul nginx.
      security: []
      x-roles: [public]
      responses:
        '200':
          description: api și FileGridMeta răspund.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: api sau FileGridMeta nu răspund.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN
  /auth/login:
    post:
      tags: [Autentificare]
      operationId: login
      summary: Autentificare, întoarce JWT și token de reîmprospătare
      description: |
        `accessToken` (JWT) este valabil 15 minute, `refreshToken` 8 ore. Parola greșită sau utilizator necunoscut: `401`.

        **Claim-uri** (ambele token-uri sunt JWT HS256, semnate cu `JWT_SECRET`):

        | Token | Claim-uri |
        |---|---|
        | `accessToken` | `sub` (utilizator), `role` (șir, de exemplu `"DISPATCH"`), `roles` (listă cu același rol, `["DISPATCH"]`), `typ: "access"`, `iss: "filegrid"`, `iat`, `exp`, `jti` |
        | `refreshToken` | `sub`, `typ: "refresh"`, `iss`, `iat`, `exp`, `jti` (fără rol) |

        `role` și `roles` au mereu aceeași valoare: `role` e forma din contract, `roles` e forma citită de interfața
        Angular (`auth.service.ts`) și de autorizarea din backend (`ROLE_<rol>`). Un `refreshToken` nu este acceptat
        ca `Authorization: Bearer`, iar un `accessToken` nu este acceptat la `/auth/refresh` (`typ` diferit).

        Utilizatorii de test (login minim): câte unul per rol, `dispecer` (DISPATCH), `teren` (FIELD), `racordari`
        (CONNECTIONS), `contor` (METER_SERVICE), `admin` (ADMIN), cu parolele generate în `.env`
        (`FILEGRID_USER_*_PASSWORD`) și afișate de scriptul de start. Un header `Authorization` trimis la
        `/auth/login`, `/auth/refresh` sau `/health` se ignoră.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: dispecer
              password: parola-generata-in-env
      responses:
        '200':
          description: Autentificat.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaXNwZWNlciIsInJvbGUiOiJESVNQQVRDSCIsImV4cCI6MTc5NDY1MjMwMH0.c2lnbmF0dXJh
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaXNwZWNlciIsInR5cCI6InJlZnJlc2giLCJleHAiOjE3OTQ2NzczMDB9.c2lnbmF0dXJh
                expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      tags: [Autentificare]
      operationId: refreshToken
      summary: Reînnoiește accessToken, fără parolă
      description: |
        Token de reîmprospătare stateless; revocarea nu este suportată. Interfața și simulatorul apelează acest
        endpoint la `401` și repetă cererea o singură dată. Rolul din noul `accessToken` (`role` și `roles`) se ia din
        configurația curentă a utilizatorului; răspunsul nu conține un `refreshToken` nou (se păstrează cel de la login).
        refreshToken expirat, invalid sau al unui utilizator dezactivat: `401`.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaXNwZWNlciIsInR5cCI6InJlZnJlc2giLCJleHAiOjE3OTQ2NzczMDB9.c2lnbmF0dXJh
      responses:
        '200':
          description: accessToken nou.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaXNwZWNlciIsInJvbGUiOiJESVNQQVRDSCIsImV4cCI6MTc5NDY1MzIwMH0.c2lnbmF0dXJh
                expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /meter-readings:
    post:
      tags: [Citiri contoare]
      operationId: ingestMeterReadings
      summary: Primește un lot de citiri de la un contor (idempotent)
      description: |
        Un lot are 1–50 KB (~70 de octeți per citire, deci 15–700 de citiri; implicit 96 = o zi la 15 minute).
        Fiecare citire rămâne unică prin `(meter_id, reading_ts)`. Corpul brut se salvează ca fișier
        `METER_READING` prin politică (cu SHA-256 și rând în `files`).

        **Idempotency-Key** = `meterId + "_" + ts` al primei citiri; trebuie să coincidă cu corpul, altfel `400`.

        | Rezultat | Cod | Când |
        |---|---|---|
        | Lot nou | `201` | citirile s-au inserat și fișierul a fost confirmat în storage |
        | Lot deja confirmat | `200` | toate rândurile au `file_id`; se numără un duplicat respins |
        | Suprapunere parțială cu alt lot | `409` `BATCH_OVERLAP` | eroare de client, nu se retrimite |
        | Lot în curs sau storage indisponibil | `503` + `Retry-After` | clientul retrimite cu aceeași cheie |
        | Bulkhead METER_READING saturat | `429` + `Retry-After` | doar pentru această categorie |

        Header-ul opțional `X-Scenario` etichetează rularea în `operation_metrics` (`normal`, `peak`, `storm`).
      x-roles: [METER_SERVICE, ADMIN]
      x-metrics: [filegrid_operation_seconds, filegrid_operation_errors_total, filegrid_meter_duplicates_total, filegrid_meter_unconfirmed, filegrid_bulkhead_rejected_total]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterReadingBatch'
            example:
              meterId: RO-MUN-0004821
              zone: Muntenia
              readings:
                - ts: '2026-11-14T00:00:00Z'
                  kwh: 0.412
                - ts: '2026-11-14T00:15:00Z'
                  kwh: 0.397
                - ts: '2026-11-14T00:30:00Z'
                  kwh: 0.388
      responses:
        '201':
          description: Lot nou, confirmat.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReadingResult'
              example:
                fileId: 3f1c8a52-7b6e-4c1d-9a38-2e5d0f9b7a14
                meterId: RO-MUN-0004821
                readingsCount: 96
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                duplicate: false
        '200':
          description: Lot deja confirmat; duplicat ignorat (același `fileId` ca la prima trimitere).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReadingResult'
              example:
                fileId: 3f1c8a52-7b6e-4c1d-9a38-2e5d0f9b7a14
                meterId: RO-MUN-0004821
                readingsCount: 96
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                duplicate: true
        '400':
          description: |
            Corp invalid, zonă necunoscută, listă goală sau `Idempotency-Key` diferit de `meterId + "_" + ts` al
            primei citiri.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: IDEMPOTENCY_KEY_MISMATCH
                message: Idempotency-Key nu coincide cu meterId și ts-ul primei citiri din corp.
                traceId: 7d2f0c9e4a1b4c38b6a5e1f20d3c8a91
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Lotul se suprapune parțial cu un alt lot deja primit (eroare de client).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 409
                code: BATCH_OVERLAP
                message: Lotul se suprapune parțial cu un lot existent pentru același contor.
                traceId: 1b9e4d7c0f2a4e63a8d1c5b7e9f30a24
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /files:
    post:
      tags: [Fișiere]
      operationId: uploadFile
      summary: Upload fișier mic (multipart)
      description: |
        Pentru `OUTAGE_RECORD` și `CONNECTION_DOC`, până la 20 MB (limita din politică, 4.2). Pentru `OUTAGE_RECORD`
        sunt obligatorii `zone` (Muntenia / Banat / Dobrogea) și `occurredAt` (implicit momentul încărcării);
        `stationId` e opțional; lipsa lor sau valori invalide: `400`. Fluxul: SHA-256 în streaming, scriere în
        storage-ul din politică, abia apoi metadate cu stare `CONFIRMED`. `CONNECTION_DOC` se criptează (AES-GCM) înainte
        de storage; răspunsul conține `sha256` (bytes-ii stocați) și `sha256Plain` (originalul).

        Rolurile permise per categorie: `OUTAGE_RECORD` → FIELD, ADMIN; `CONNECTION_DOC` → CONNECTIONS, ADMIN.
        Orice alt acces: `403` (la documente incrementează `filegrid_doc_access_total{result="denied"}`).
      x-roles: [FIELD, CONNECTIONS, ADMIN]
      x-metrics: [filegrid_operation_seconds, filegrid_operation_errors_total, filegrid_bulkhead_rejected_total, filegrid_doc_access_total]
      parameters:
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category:
                  type: string
                  enum: [OUTAGE_RECORD, CONNECTION_DOC]
                file:
                  type: string
                  format: binary
                zone:
                  $ref: '#/components/schemas/Zone'
                occurredAt:
                  type: string
                  format: date-time
                  description: Doar OUTAGE_RECORD. ISO-8601 UTC; implicit momentul încărcării.
                stationId:
                  type: string
                  description: Doar OUTAGE_RECORD, opțional.
            encoding:
              file:
                contentType: application/octet-stream, application/pdf, image/jpeg, image/png
      responses:
        '201':
          description: Fișier confirmat în storage.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
              examples:
                outage:
                  summary: Înregistrare de avarie
                  value:
                    id: 5b7e2c1a-90d4-4f6e-8a13-c4d2e7f0b9a6
                    category: OUTAGE_RECORD
                    originalName: avarie-ST-Brasov-114.csv
                    contentType: text/csv
                    size: 4718592
                    sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                    sha256Plain: null
                    storage: S3
                    status: CONFIRMED
                    encrypted: false
                    createdAt: '2026-11-14T09:41:12Z'
                    createdBy: teren1
                    outage:
                      zone: Muntenia
                      stationId: ST-BRASOV-114
                      occurredAt: '2026-11-14T09:32:00Z'
                document:
                  summary: Document de racordare (criptat)
                  value:
                    id: a1d94f30-6c2b-4e87-b5f0-3d8e91c7a2b4
                    category: CONNECTION_DOC
                    originalName: cerere-racordare-fictiv-001.pdf
                    contentType: application/pdf
                    size: 1048576
                    sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
                    sha256Plain: 3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a
                    storage: DB
                    status: CONFIRMED
                    encrypted: true
                    createdAt: '2026-11-14T09:44:03Z'
                    createdBy: racordari1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Fișiere]
      operationId: searchFiles
      summary: Căutare fișiere (filtre și paginare)
      description: |
        Filtre: `category`, `q` (text în numele fișierului), `from` / `to` (interval pe `createdAt`), `page` (de la 1),
        `size`. Fără `category`, rezultatele se restrâng la categoriile permise rolului; cu o categorie nepermisă: `403`.
        Pentru `CONNECTION_DOC` numele original e criptat în storage, deci `q` nu se aplică numelui (documentele
        se pot filtra doar după celelalte filtre); numele decriptat se întoarce rolurilor autorizate, iar accesul
        se auditează.

        Categorii vizibile: DISPATCH → OUTAGE_RECORD, METER_READING; FIELD → OUTAGE_RECORD, INSPECTION_VIDEO;
        CONNECTIONS → CONNECTION_DOC; ADMIN → toate; METER_SERVICE → niciuna.
      x-roles: [DISPATCH, FIELD, CONNECTIONS, ADMIN]
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: q
          in: query
          description: Text căutat în numele fișierului (nu se aplică la CONNECTION_DOC).
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          description: Început de interval, inclusiv (după `createdAt`).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Sfârșit de interval, exclusiv (după `createdAt`).
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagină de rezultate.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
              example:
                items:
                  - id: 5b7e2c1a-90d4-4f6e-8a13-c4d2e7f0b9a6
                    category: OUTAGE_RECORD
                    originalName: avarie-ST-Brasov-114.csv
                    contentType: text/csv
                    size: 4718592
                    sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                    sha256Plain: null
                    storage: S3
                    status: CONFIRMED
                    encrypted: false
                    createdAt: '2026-11-14T09:41:12Z'
                    createdBy: teren1
                    outage:
                      zone: Muntenia
                      stationId: ST-BRASOV-114
                      occurredAt: '2026-11-14T09:32:00Z'
                  - id: 8e0a6d47-1f3b-4a52-b9c8-7d5e2a4f1c03
                    category: OUTAGE_RECORD
                    originalName: avarie-ST-Constanta-020.csv
                    contentType: text/csv
                    size: 2097152

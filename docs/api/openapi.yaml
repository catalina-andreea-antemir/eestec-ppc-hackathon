      summary: Recomandare de storage per categorie (matrice 4×3 cu scor)
      description: |
        Matricea 4 categorii × 3 storage-uri vine din benchmark (`source=benchmark`) completat cu date live; are mereu
        12 celule (fără celule goale). `score` (0–100) combină latență, erori și cost relativ. „Costul” este o
        presupunere explicită, relativă per GB, dintr-un YAML documentat (`costAssumption`).
        Forma răspunsului este propusă (punctul 12 din descrierea generală).
      x-roles: [DISPATCH, ADMIN]
      responses:

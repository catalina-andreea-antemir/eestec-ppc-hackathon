components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obținut la `POST /auth/login`, valabil 15 minute (`expiresIn`). Claim-uri: `sub` (utilizator),
        `role` (DISPATCH | FIELD | CONNECTIONS | METER_SERVICE | ADMIN) și `roles` (listă cu același rol), `typ: "access"`.
        Lipsă, expirat sau refreshToken în loc de accessToken: `401`; rol nepermis: `403`.
        Reînnoire cu `POST /auth/refresh`.
  headers:
    X-Trace-Id:
      description: Identificatorul operației, același în loguri (JSON, Loki) de la cerere până la storage.
      schema:
        type: string
        example: 7d2f0c9e4a1b4c38b6a5e1f20d3c8a91
    Retry-After:
      description: Secunde până la următoarea încercare.
      schema:
        type: integer
        minimum: 0
        example: 5
    X-Content-SHA256:
      description: SHA-256 (hex) al bytes-ilor trimiși (la CONNECTION_DOC, `sha256Plain`).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
        example: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
    Accept-Ranges:
      description: '`bytes` când descărcarea poate fi reluată; absent la CONNECTION_DOC.'
      schema:
        type: string
        enum: [bytes]
    Content-Range:
      description: Intervalul trimis, ca `bytes <start>-<end>/<total>`.
      schema:
        type: string
        example: bytes 0-16777215/1181116006
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        `meterId + "_" + ts` al primei citiri din lot (identic cu corpul), de exemplu
        `RO-MUN-0004821_2026-11-14T00:00:00Z`. Altfel `400`. Aceeași cheie la fiecare reîncercare.
      schema:
        type: string
        minLength: 3
        maxLength: 256
        example: RO-MUN-0004821_2026-11-14T00:00:00Z
    Scenario:
      name: X-Scenario
      in: header
      required: false
      description: Etichetă a rulării, scrisă în `operation_metrics.scenario` (`normal`, `peak`, `storm`; benchmark-ul folosește `benchmark`).
      schema:
        type: string
        pattern: '^[a-z0-9_-]{1,32}$'
        example: peak
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: id
      in: path
      required: true
      description: '`uploadId` întors de `POST /uploads`.'
      schema:
        type: string
        format: uuid
    Range:
      name: Range
      in: header
      required: false
      description: 'Interval de octeți, de exemplu `bytes=16777216-` (nu se aplică la CONNECTION_DOC).'
      schema:
        type: string
        example: bytes=16777216-
  responses:
    BadRequest:
      description: Cerere invalidă (câmp lipsă, valoare nepermisă, corp sau parametri greșiți).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            code: VALIDATION_ERROR
            message: Câmpul „zone” este obligatoriu pentru OUTAGE_RECORD.
            traceId: 7d2f0c9e4a1b4c38b6a5e1f20d3c8a91
            details:
              field: zone
    Unauthorized:
      description: "Fără token, token expirat sau invalid (la `/downloads/{token}`: link expirat sau invalid)."
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        WWW-Authenticate:
          description: '`Bearer`'
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            code: UNAUTHORIZED
            message: Autentificare necesară sau token expirat.
            traceId: 4e1a7c93b0d54f28a6c3e9d1b7f02a85
    Forbidden:
      description: Rolul nu are voie pe această operație sau categorie (matricea 4.4). La documente de racordare incrementează `filegrid_doc_access_total{result="denied"}`.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            code: FORBIDDEN
            message: Rolul DISPATCH nu are acces la categoria CONNECTION_DOC.
            traceId: 8b2d6f1e0c9a4375a1e4d7c3b0f58e92
    NotFound:
      description: Resursa nu există (sau nu e vizibilă rolului).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            code: NOT_FOUND
            message: Fișierul nu există.
            traceId: 0f9c5a2e7b1d4836c4a8e1d6b3f07a29
    PayloadTooLarge:
      description: Corpul depășește mărimea maximă din politica categoriei sau din limita nginx (`client_max_body_size 100m` per cerere).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 413
            code: PAYLOAD_TOO_LARGE
            message: Fișierul depășește mărimea maximă permisă pentru categorie (20 MB).
            traceId: a5c8e1d3f0b24976b2d9e4a7c1f60b38
            details:
              maxBytes: 20971520
    RangeNotSatisfiable:
      description: Interval `Range` invalid sau în afara fișierului.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        Content-Range:
          description: '`bytes */<total>`'
          schema:
            type: string
            example: bytes */1181116006
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 416
            code: RANGE_NOT_SATISFIABLE
            message: Intervalul cerut este în afara fișierului.
            traceId: d1e7b4a0c5f94836a2c8e3d9b6f01a57
    FileCorrupt:
      description: Fișierul este corupt (hash nepotrivit, detectat înainte de trimitere).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 409
            code: FILE_CORRUPT
            message: fișier corupt
            traceId: c0e57a1d93f84b26a4d8e1b7f52c6a09
            details:
              fileId: 6c4b1e9d-3a70-4d25-8f6b-0e9a2d7c5b31
              expectedSha256: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
              actualSha256: d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35
    TooManyRequests:
      description: Bulkhead-ul categoriei este saturat (limita de cereri paralele din politică). Afectează doar categoria respectivă.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 429
            code: CATEGORY_SATURATED
            message: Prea multe cereri paralele pentru categoria OUTAGE_RECORD; reîncearcă.
            traceId: 6a0d3e9c1f7b4285b8e2d5a1c4f09b73
            retryAfterSeconds: 2
    ServiceUnavailable:
      description: |
        Storage-ul sau FileGridMeta e indisponibil (circuit breaker deschis, SQL Server căzut), sau lotul e în curs de
        procesare. Nimic confirmat nu se pierde; clientul reîncearcă cu aceeași cheie / aceeași bucată.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            storageDown:
              summary: Storage indisponibil, fără rezervă disponibilă
              value:
                status: 503
                code: STORAGE_UNAVAILABLE
                message: Storage-ul FTP este indisponibil; reîncearcă.
                traceId: 9b4e1d7a0c3f4852a6d8e2c1b5f07a34
                retryAfterSeconds: 10
            batchInProgress:
              summary: Lot în curs de procesare (Idempotency-Key)
              value:
                status: 503
                code: BATCH_IN_PROGRESS
                message: Lotul este în curs de procesare; retrimite cu aceeași cheie.
                traceId: e3a8c5d1b7f04962a1d4e8c0b6f27a95
                retryAfterSeconds: 5
    FileContent:
      description: Conținutul complet al fișierului, în streaming.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Content-SHA256:
          $ref: '#/components/headers/X-Content-SHA256'
        Accept-Ranges:
          $ref: '#/components/headers/Accept-Ranges'
        Content-Disposition:
          description: '`attachment; filename="..."`'
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    PartialFileContent:
      description: Intervalul cerut (nu la CONNECTION_DOC).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Content-SHA256:
          $ref: '#/components/headers/X-Content-SHA256'
        Accept-Ranges:
          $ref: '#/components/headers/Accept-Ranges'
        Content-Range:
          $ref: '#/components/headers/Content-Range'
        Content-Length:
          schema:
            type: integer
            format: int64
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  schemas:
    Category:
      type: string
      enum: [METER_READING, OUTAGE_RECORD, CONNECTION_DOC, INSPECTION_VIDEO]
      description: |
        Categoriile de date. Politica implicită (4.2, `resources/policies/*.yml`):

        | Categorie | Principal | Rezervă | Mărime max | Chunk | Cereri paralele / instanță | Criptare |
        |---|---|---|---|---|---|---|
        | METER_READING | DB | S3 | 256 KB | – | 50 | nu |
        | OUTAGE_RECORD | S3 | DB | 20 MB | – | 20 | nu |
        | CONNECTION_DOC | DB | S3 | 20 MB | – | 10 | da (AES-GCM) |
        | INSPECTION_VIDEO | FTP | S3 | 5 GB | 16 MiB (min 5 MiB) | 4 | nu |
    StorageType:
      type: string
      enum: [FTP, S3, DB]
      description: FTP (serviciul `ftp`), S3 (MinIO) și DB (SQL Server, baza FileGridStorage).
    Zone:
      type: string
      enum: [Muntenia, Banat, Dobrogea]
    Role:
      type: string
      enum: [DISPATCH, FIELD, CONNECTIONS, METER_SERVICE, ADMIN]
      description: |
        Matricea rolurilor (4.4). Orice acces în afara matricei: `403` (la documente incrementează
        `filegrid_doc_access_total{result="denied"}`).

        | Rol | Poate încărca | Poate căuta și descărca | Altele |
        |---|---|---|---|
        | METER_SERVICE | METER_READING (`POST /meter-readings`) | – | folosit de simulator |
        | FIELD | OUTAGE_RECORD, INSPECTION_VIDEO | OUTAGE_RECORD, INSPECTION_VIDEO | – |
        | DISPATCH | – | OUTAGE_RECORD, METER_READING | `/stats/*` |
        | CONNECTIONS | CONNECTION_DOC | CONNECTION_DOC | acces auditat |
        | ADMIN | toate | toate | `/stats/*`, `/admin/*` (benchmark, health) |
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 200
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT, valabil 15 minute.
        refreshToken:
          type: string
          description: Token stateless, valabil 8 ore; revocarea nu e suportată.
        expiresIn:
          type: integer
          description: Secunde de valabilitate ale `accessToken`.
          example: 900
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AccessToken:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 900
    MeterReadingBatch:
      type: object
      required: [meterId, zone, readings]
      properties:
        meterId:
          type: string
          minLength: 1
          maxLength: 64
          example: RO-MUN-0004821
        zone:
          $ref: '#/components/schemas/Zone'
        readings:
          type: array
          minItems: 1
          description: 1–50 KB în total (~70 de octeți per citire; implicit 96 de citiri = o zi la 15 minute).
          items:
            type: object
            required: [ts, kwh]
            properties:
              ts:
                type: string
                format: date-time
                description: ISO-8601 UTC; împreună cu `meterId` identifică unic citirea.
              kwh:
                type: number
                minimum: 0
    MeterReadingResult:
      type: object
      required: [fileId, meterId, readingsCount, sha256, duplicate]
      properties:
        fileId:
          type: string
          format: uuid
          description: Fișierul METER_READING în care s-a salvat corpul brut al lotului.
        meterId:
          type: string
        readingsCount:
          type: integer
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        duplicate:
          type: boolean
          description: '`true` la `200` (lot deja confirmat, ignorat).'
    FileMetadata:
      type: object
      required: [id, category, originalName, contentType, size, sha256, storage, status, encrypted, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/Category'
        originalName:
          type: string
          description: Numele original (decriptat pentru rolurile autorizate la CONNECTION_DOC).
        contentType:
          type: string
        size:
          type: integer
          format: int64
          description: Mărimea fișierului original, în octeți.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 pe bytes-ii stocați (cifrați la CONNECTION_DOC). Îl folosește `/verify`.
        sha256Plain:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: SHA-256 pe fișierul original; doar la documente criptate. Îl arată interfața.
        storage:
          $ref: '#/components/schemas/StorageType'
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED]
        encrypted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        outage:
          $ref: '#/components/schemas/OutageDetails'
    OutageDetails:
      type: object
      description: Doar la OUTAGE_RECORD (rândul din `outage_records`).
      required: [zone, occurredAt]
      properties:
        zone:
          $ref: '#/components/schemas/Zone'
        stationId:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
    FilePage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileMetadata'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    VerifyResult:
      type: object
      required: [fileId, ok, algorithm, deep, expectedSha256, actualSha256, verifiedAt]
      properties:
        fileId:
          type: string
          format: uuid
        ok:
          type: boolean
          description: Mereu `true` la `200`; la nepotrivire răspunsul este `409`.
        algorithm:
          type: string
          enum: [SHA-256]
        deep:
          type: boolean
        expectedSha256:
          type: string
        actualSha256:
          type: string
        expectedSha256Plain:
          type: string
          nullable: true
          description: Doar cu `deep=true` la CONNECTION_DOC.
        actualSha256Plain:
          type: string
          nullable: true
        verifiedAt:
          type: string
          format: date-time
    DownloadLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: Cale relativă, `/api/v1/downloads/{token}`; fără date personale.
        expiresAt:
          type: string
          format: date-time
          description: Valabil 15 minute de la creare.
    UploadInit:
      type: object
      required: [category, fileName, totalSize]
      properties:
        category:
          type: string
          enum: [INSPECTION_VIDEO]
          description: Singura categorie cu `chunkSize` în politica implicită (4.2).
        fileName:
          type: string
          maxLength: 255
        totalSize:
          type: integer
          format: int64
          minimum: 1
    UploadSession:
      type: object
      required: [uploadId, category, fileName, storage, totalSize, chunkSize, totalChunks, nextChunk, receivedBytes, status, createdAt, lastActivityAt]
      properties:
        uploadId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/Category'
        fileName:
          type: string
        storage:
          allOf:
            - $ref: '#/components/schemas/StorageType'
          description: Storage-ul ales la `init`; sesiunea rămâne legată de el.
        totalSize:
          type: integer
          format: int64
        chunkSize:
          type: integer
          description: Din politică; minim 5 MiB (5242880), maxim 64 MiB (67108864). Ultima bucată poate fi mai mică.
        totalChunks:
          type: integer
        nextChunk:
          type: integer
          minimum: 1
          description: Următoarea bucată așteptată (de la 1).
        receivedBytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, ABORTED, ABANDONED]
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
          description: Sesiunile inactive peste 24 h se curăță automat.
    ChunkAck:
      type: object
      required: [n, size, sha256, nextChunk, duplicate]
      properties:
        n:
          type: integer
          minimum: 1
        size:
          type: integer
          format: int64
        sha256:
          type: string
          description: SHA-256 al bucății, calculat la primire (`upload_chunks`).
        nextChunk:
          type: integer
        duplicate:
          type: boolean
          description: '`true` dacă bucata fusese deja primită (confirmare idempotentă).'
    Error:
      type: object
      required: [status, code, message, traceId]
      description: Formatul unic al erorilor.
      properties:
        status:
          type: integer
          description: Codul HTTP.
        code:
          type: string
          description: |
            Cod stabil, citibil de mașină. Valori: `VALIDATION_ERROR`, `IDEMPOTENCY_KEY_MISMATCH`, `UNAUTHORIZED`,
            `FORBIDDEN`, `NOT_FOUND`, `PAYLOAD_TOO_LARGE`, `RANGE_NOT_SATISFIABLE`, `FILE_CORRUPT`, `BATCH_OVERLAP`,
            `CHUNK_OUT_OF_ORDER`, `UPLOAD_BUSY`, `UPLOAD_INCOMPLETE`, `UPLOAD_NOT_ACTIVE`, `BENCHMARK_RUNNING`,
            `CATEGORY_SATURATED`, `STORAGE_UNAVAILABLE`, `BATCH_IN_PROGRESS`.
        message:
          type: string
          description: Mesaj în română, fără date personale.
        traceId:
          type: string
          description: Același cu header-ul `X-Trace-Id`.
        retryAfterSeconds:
          type: integer
          description: Doar la 429/503 și `UPLOAD_BUSY`; același cu header-ul `Retry-After`.
        details:
          type: object
          additionalProperties: true
          description: Informații suplimentare (de exemplu hash-urile la `FILE_CORRUPT`, `expectedChunk` la `CHUNK_OUT_OF_ORDER`).
    StorageAdvisor:
      type: object
      required: [generatedAt, basis, costAssumption, matrix, recommendations, interpretation]
      properties:
        generatedAt:
          type: string
          format: date-time
        basis:
          type: object
          properties:
            benchmarkRunAt:
              type: string
              format: date-time
              nullable: true
            benchmarkSamples:
              type: integer
            liveSamples:
              type: integer
        costAssumption:
          type: object
          description: Presupunerea explicită de cost relativ per GB, din YAML.
          additionalProperties: true
        matrix:
          type: array
          description: Exact 12 celule (4 categorii × 3 storage-uri).
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/StorageScore'
        recommendations:
          type: array
          items:
            type: object
            required: [category, recommendedStorage, currentPolicyStorage, matchesPolicy, rationale]
            properties:
              category:
                $ref: '#/components/schemas/Category'
              recommendedStorage:
                $ref: '#/components/schemas/StorageType'
              currentPolicyStorage:
                $ref: '#/components/schemas/StorageType'
              matchesPolicy:
                type: boolean
              rationale:
                type: string
        interpretation:
          $ref: '#/components/schemas/Interpretation'
    StorageScore:
      type: object
      required: [category, storage, score, latencyP50Ms, latencyP95Ms, errorRatePercent, relativeCostPerGb, samples, benchmarked]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        storage:
          $ref: '#/components/schemas/StorageType'
        score:
          type: number
          minimum: 0
          maximum: 100
        latencyP50Ms:
          type: number
        latencyP95Ms:
          type: number
        errorRatePercent:
          type: number
        relativeCostPerGb:
          type: number
        samples:
          type: integer
        benchmarked:
          type: boolean
          description: '`true` dacă celula are date din benchmark.'
    PeakVsNormal:
      type: object
      required: [generatedAt, normal, peak, categories, interpretation]
      properties:
        generatedAt:
          type: string
          format: date-time
        normal:
          $ref: '#/components/schemas/ScenarioWindow'
        peak:
          $ref: '#/components/schemas/ScenarioWindow'
        categories:
          type: array
          items:
            type: object
            required: [category, normal, peak, p95ChangePercent]
            properties:
              category:
                $ref: '#/components/schemas/Category'
              normal:
                $ref: '#/components/schemas/ScenarioStats'
              peak:
                $ref: '#/components/schemas/ScenarioStats'
              p95ChangePercent:
                type: number
        interpretation:
          $ref: '#/components/schemas/Interpretation'
    ScenarioWindow:
      type: object
      required: [scenario, from, to]
      properties:
        scenario:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ScenarioStats:
      type: object
      required: [requests, throughputPerMinute, latencyP50Ms, latencyP95Ms, latencyP99Ms, errorRatePercent, rejected]
      properties:
        requests:
          type: integer
        throughputPerMinute:
          type: number
        latencyP50Ms:
          type: number
        latencyP95Ms:
          type: number
        latencyP99Ms:
          type: number
        errorRatePercent:
          type: number
        rejected:
          type: integer
          description: Cereri respinse de bulkhead (`filegrid_bulkhead_rejected_total`).
    Anomalies:
      type: object
      required: [generatedAt, from, to, rule, anomalies, silentMeters, readingsByZoneHour, interpretation]
      properties:
        generatedAt:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        rule:
          type: string
        anomalies:
          type: object
          required: [items, page, size, totalItems, totalPages]
          properties:
            items:
              type: array
              items:
                type: object
                required: [meterId, zone, readingTs, kwh, median, stddev, threshold, deviations]
                properties:
                  meterId:
                    type: string
                  zone:
                    $ref: '#/components/schemas/Zone'
                  readingTs:
                    type: string
                    format: date-time
                  kwh:
                    type: number
                  median:
                    type: number
                  stddev:
                    type: number
                  threshold:
                    type: number
                    description: mediană + 3 × abatere standard.
                  deviations:
                    type: number
                    description: Câte abateri standard peste mediană.
            page:
              type: integer
            size:
              type: integer
            totalItems:
              type: integer
              format: int64
            totalPages:
              type: integer
        silentMeters:
          type: array
          items:
            type: object
            required: [meterId, zone, lastReadingTs, silentMinutes]
            properties:
              meterId:
                type: string
              zone:
                $ref: '#/components/schemas/Zone'
              lastReadingTs:
                type: string
                format: date-time
              silentMinutes:
                type: integer
        readingsByZoneHour:
          type: array
          items:
            type: object
            required: [zone, hour, readings, totalKwh]
            properties:
              zone:
                $ref: '#/components/schemas/Zone'
              hour:
                type: string
                format: date-time
                description: Începutul orei, UTC.
              readings:
                type: integer
              totalKwh:
                type: number
        interpretation:
          $ref: '#/components/schemas/Interpretation'
    OutageZones:
      type: object
      required: [generatedAt, from, to, totalOutages, ranking, byHour, interpretation]
      properties:
        generatedAt:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totalOutages:
          type: integer
        ranking:
          type: array
          items:
            type: object
            required: [rank, zone, outages, sharePercent, vsAverageRatio, peakHour]
            properties:
              rank:
                type: integer
              zone:
                $ref: '#/components/schemas/Zone'
              outages:
                type: integer
              sharePercent:
                type: number
              vsAverageRatio:
                type: number
                description: Raport față de media pe zone.
              peakHour:
                type: integer
                minimum: 0
                maximum: 23
                description: Ora (UTC) cu cele mai multe avarii.
        byHour:
          type: array
          items:
            type: object
            required: [zone, hour, outages]
            properties:
              zone:
                $ref: '#/components/schemas/Zone'
              hour:
                type: integer
                minimum: 0
                maximum: 23
              outages:
                type: integer
        interpretation:
          $ref: '#/components/schemas/Interpretation'
    Requirements:
      type: object
      required: [generatedAt, requirements]
      properties:
        generatedAt:
          type: string
          format: date-time
        requirements:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [id, category, title, status, message, thresholds, current]
            properties:
              id:
                type: string
                enum: [R1, R2, R3, R4]
              category:
                $ref: '#/components/schemas/Category'
              title:
                type: string
              status:
                type: string
                enum: [OK, AT_RISK]
                description: '`OK` = plăcuță verde, `AT_RISK` = roșie (cerința e în pericol).'
              message:
                type: string
              thresholds:
                type: object
                additionalProperties: true
              current:
                type: object
                additionalProperties: true
    Interpretation:
      type: string
      description: Propoziție de interpretare în limba română, generată pe reguli simple, pentru oameni care iau decizii.
    BenchmarkResult:
      type: object
      required: [startedAt, finishedAt, source, scenario, results]
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [benchmark]
        scenario:
          type: string
          enum: [benchmark]
        results:
          type: array
          description: Câte un rând per combinație categorie × storage (12 în total).
          items:
            type: object
            required: [category, storage, operation, samples, sizeBytes, latencyP50Ms, latencyP95Ms, throughputMBps, errors]
            properties:
              category:
                $ref: '#/components/schemas/Category'
              storage:
                $ref: '#/components/schemas/StorageType'
              operation:
                type: string
              samples:
                type: integer
              sizeBytes:
                type: integer
                format: int64
              latencyP50Ms:
                type: number
              latencyP95Ms:
                type: number
              throughputMBps:
                type: number
              errors:
                type: integer
    AdminHealth:
      type: object
      required: [status, instance, checkedAt, metadataDb, storages]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
          description: '`UP` = totul funcționează; `DEGRADED` = un storage e DOWN; `DOWN` = FileGridMeta nu răspunde.'
        instance:
          type: string
          description: Instanța api care a răspuns.
        checkedAt:
          type: string
          format: date-time
        metadataDb:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [UP, DOWN]
        storages:
          type: array
          items:
            type: object
            required: [storage, status, circuitBreaker]
            properties:
              storage:
                $ref: '#/components/schemas/StorageType'
              status:
                type: string
                enum: [UP, DOWN]
              circuitBreaker:
                type: string
                enum: [CLOSED, OPEN, HALF_OPEN]
              detail:
                type: string
  x-role-matrix:
    description: Matricea rolurilor din 4.4, într-o formă care se poate citi automat (rolul → ce poate).
    METER_SERVICE:
      upload: [METER_READING]
      searchAndDownload: []
      other: [simulator]
    FIELD:
      upload: [OUTAGE_RECORD, INSPECTION_VIDEO]
      searchAndDownload: [OUTAGE_RECORD, INSPECTION_VIDEO]
      other: []
    DISPATCH:
      upload: []
      searchAndDownload: [OUTAGE_RECORD, METER_READING]
      other: ['/stats/*']
    CONNECTIONS:
      upload: [CONNECTION_DOC]
      searchAndDownload: [CONNECTION_DOC]
      other: [acces auditat]
    ADMIN:
      upload: [METER_READING, OUTAGE_RECORD, CONNECTION_DOC, INSPECTION_VIDEO]
      searchAndDownload: [METER_READING, OUTAGE_RECORD, CONNECTION_DOC, INSPECTION_VIDEO]
      other: ['/stats/*', '/admin/*']
  x-metrics:
    description: |
      Numele exacte ale metricilor (secțiunea 4.3), fixate la ora 2. Etichetele obligatorii sunt `category`, `storage`
      și `operation`. Micrometer publică timerul ca serii `_bucket`, `_sum`, `_count` (histogramă, pentru p50/p95/p99).
      Gauge-urile identice pe toate instanțele (`filegrid_meter_unconfirmed`, `filegrid_storage_up`) se agregă cu
      `max`, nu cu `sum`. Celelalte se agregă cu `sum by (category, storage)`.
    labelValues:
      category: [METER_READING, OUTAGE_RECORD, CONNECTION_DOC, INSPECTION_VIDEO]
      storage: [FTP, S3, DB]
      operation: [upload, upload_chunk, upload_complete, download, verify, delete, health]
      outcome: [ok, error, rejected]
      error: [storage_unavailable, timeout, circuit_open, integrity, internal]
      result: [ok, denied, error]
    api:
      - name: filegrid_operation_seconds
        type: timer (histogramă)
        labels: [category, storage, operation, outcome]
        usedFor: p50/p95/p99, throughput, alerta 2
      - name: filegrid_operation_errors_total
        type: counter
        labels: [category, storage, operation, error]
        usedFor: rata de erori
      - name: filegrid_meter_duplicates_total
        type: counter
        labels: [category]
        usedFor: duplicate respinse (citirile retrimise; category este METER_READING)
      - name: filegrid_meter_unconfirmed
        type: gauge
        labels: []
        usedFor: alerta 1 (rânduri fără file_id mai vechi de 60 s)
      - name: filegrid_transfers_failed_total
        type: counter
        labels: [category, storage]
        usedFor: alerta 3 (transferuri video eșuate)
      - name: filegrid_doc_access_total
        type: counter
        labels: [result]
        usedFor: alerta 4 (acces neașteptat la documente; result = ok, denied, error)
      - name: filegrid_integrity_failures_total
        type: counter
        labels: [category, storage]
        usedFor: fișiere corupte detectate
      - name: filegrid_storage_up
        type: gauge
        labels: [storage]
        usedFor: health per storage (1 = UP, 0 = DOWN)
      - name: filegrid_bulkhead_rejected_total
        type: counter
        labels: [category]
        usedFor: izolare per categorie (cereri respinse cu 429)
      - name: filegrid_opmetrics_dropped_total
        type: counter
        labels: []
        usedFor: pierderi în recorder (coadă plină la `operation_metrics`)
    simulator:
      description: Metricile simulatorului numără citiri individuale, nu loturi. Alerta 1 nu compară direct „trimise” cu „confirmate”.
      metrics:
        - name: sim_readings_sent_total
          type: counter
          usedFor: citirile din loturile trimise, numărate o singură dată, la prima încercare
        - name: sim_readings_confirmed_total
          type: counter
          usedFor: citirile din loturile confirmate cu 201 sau 200
        - name: sim_batches_retried_total
          type: counter
          usedFor: loturi retrimise
        - name: sim_readings_pending
          type: gauge
          usedFor: citiri în curs, inclusiv în reîncercări
        - name: sim_readings_abandoned_total
          type: counter
          usedFor: citiri din loturi abandonate după 10 minute de reîncercări

        Dacă storage-ul sesiunii cade, bucățile primesc `503` cu `Retry-After`, iar clientul reia după revenire.
        Dacă storage-ul nu revine în 10 minute sau clientul apelează `abort`, sesiunea se abandonează, iar un upload
        nou alege storage-ul de rezervă (după health). Sesiunile inactive peste 24 h se curăță automat.

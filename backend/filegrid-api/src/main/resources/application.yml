# Base configuration (C1). Port comes from SERVER_PORT (default 8080); passwords and URLs come from
# environment variables, so no secret lives in the repo.
server:
  tomcat:
    threads:
      # C9: the sum of maxConcurrentRequests across policies (50+20+10+4 = 84) stays below this cap, leaving ~100
      # threads for health, auth, search and requests rejected by the bulkhead (those do not hold a thread).
      max: 200
      min-spare: 20
    # Pending connections when all threads are busy (beyond this, connections are refused).
    accept-count: 100
spring:
  application:
    name: filegrid-api
  # Multipart upload (C7): the file is spooled to a container temp file and deleted after the request.
  # This limit mirrors nginx; the per-category limit (4.2) is enforced by ingest (413).
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0
  autoconfigure:
    # Disable Spring Security's generated (and logged) default password; users come from config (C4).
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Structured JSON logs on the console (native since Spring Boot 3.4). MDC (traceId, spanId) is included.
logging:
  structured:
    format:
      console: logstash

# FileGrid (C4). Secrets come only from the environment (.env generated by scripts/start.*); no defaults for them.
filegrid:
  policies:
    # Directory with policies/*.yml. In Docker: FILEGRID_POLICY_DIR=/app/policies (mounted), reloaded without restart.
    location: ${FILEGRID_POLICY_DIR:classpath:/policies/}
    reload-interval: ${FILEGRID_POLICY_RELOAD_INTERVAL:2s}
  security:
    jwt:
      # HS256, base64, at least 32 bytes after decoding. The app refuses to start without it.
      secret: ${JWT_SECRET:}
      issuer: filegrid
      access-token-ttl: 15m
      refresh-token-ttl: 8h
    # Test users, one per role (minimal login). Empty password = disabled user.
    users:
      dispecer:
        role: DISPATCH
        password: ${FILEGRID_USER_DISPECER_PASSWORD:}
      teren:
        role: FIELD
        password: ${FILEGRID_USER_TEREN_PASSWORD:}
      racordari:
        role: CONNECTIONS
        password: ${FILEGRID_USER_RACORDARI_PASSWORD:}
      contor:
        role: METER_SERVICE
        password: ${FILEGRID_USER_CONTOR_PASSWORD:}
      admin:
        role: ADMIN
        password: ${FILEGRID_USER_ADMIN_PASSWORD:}
  # Document encryption (C10): AES-256-GCM, 32-byte base64 key from the environment only (never logged).
  # The app refuses to start without it if any policy has encryption: true.
  encryption:
    key: ${DOC_ENCRYPTION_KEY:}
  # Per-storage resilience (C11): retry with backoff only for reads / idempotent operations, circuit breaker and
  # periodic health checks (timeout <= 2 s). The values below are the defaults.
  resilience:
    retry-attempts: 3
    retry-initial-backoff: 100ms
    retry-multiplier: 2
    retry-jitter: 0.5
    failure-rate-threshold: 50
    minimum-calls: 5
    sliding-window: 10
    open-wait: 5s
    half-open-calls: 2
    health-interval: 3s
    health-timeout: 2s
    health-failures-to-open: 2
  # Download (C8): HMAC-signed links (key from the environment only) and the size threshold under which a file is
  # verified before sending (above it, the hash is checked while streaming).
  download:
    link-secret: ${DOWNLOAD_LINK_SECRET:}
    link-ttl: 15m
    pre-verify-max-size: 16MB
  # S3 / MinIO (C5): app user created by minio-init (not the root account). Without credentials S3Adapter starts
  # unconfigured (health down, operations -> 503). No retry here; resilience is layered on top (C11).
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    connect-timeout: 2s
    socket-timeout: 30s
    operation-timeout: 10s
    health-timeout: 2s
    # Larger objects use multipart internally, with fixed-size parts (minimum 5 MiB).
    part-size: 16MB
  # FTP / vsftpd (C6): passive mode, one connection per operation, no retry here (resilience is layered on top, C11).
  # Without credentials FtpAdapter starts unconfigured (health down, operations -> 503).
  ftp:
    host: ${FTP_HOST:}
    port: ${FTP_PORT:21}
    user: ${FTP_USER:}
    password: ${FTP_PASSWORD:}
    connect-timeout: 2s
    control-timeout: 30s
    data-timeout: 30s
    health-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

---
# Default profile: NO database. Datasource, JDBC and Flyway are disabled;
# they are enabled by the "db" profile (SPRING_PROFILES_ACTIVE=db).
spring:
  config:
    activate:
      on-profile: "!db"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthContributorAutoConfiguration

---
# "db" profile: FileGridMeta on Microsoft SQL Server + Flyway. No credential defaults on purpose:
# if the variables are missing the app does not start with this profile.
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${META_DB_URL}
    username: ${META_DB_USER}
    password: ${META_DB_PASSWORD}
    hikari:
      pool-name: meta
      # C9: separate from the storage pool. Metadata queries (readings, upload sessions, audit) are short; 40 covers
      # concurrent requests of the categories that hit metadata, and pool exhaustion fails fast with 503.
      maximum-pool-size: 40
      minimum-idle: 5
      # No long waits when SQL Server is unresponsive (fast health checks and 503s).
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:filesystem:../../db/migrations}
# FileGridStorage (DbStorageAdapter, O3): separate pool, opened lazily (DataSourceConfig).
filegrid:
  storage-db:
    url: ${STORAGE_DB_URL}
    username: ${STORAGE_DB_USER}
    password: ${STORAGE_DB_PASSWORD}
    hikari:
      pool-name: storage
      # C9: separate pool, smaller because a connection is held for the whole content read/write.
      maximum-pool-size: 30
      minimum-idle: 2
      # Leaves room for SELECT 1 within the 2 s total budget of the health check.
      connection-timeout: 750
      validation-timeout: 500
      initialization-fail-timeout: -1
      data-source-properties:
        loginTimeout: 2
        connectRetryCount: 0
        lockTimeout: 1000
        cancelQueryTimeout: 1
        socketTimeout: 6000
        responseBuffering: adaptive
      # JDBC session options required for writes to a table with a filtered index.
      connection-init-sql: >-
        SET ANSI_NULLS ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON;
        SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON;
        SET QUOTED_IDENTIFIER ON; SET NUMERIC_ROUNDABORT OFF;

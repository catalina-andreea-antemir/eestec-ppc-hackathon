# Configurare de baza (C1). Portul se ia din SERVER_PORT (implicit 8080), iar parolele si URL-urile
# din variabile de mediu; nicio valoare secreta in repo.
server:
  tomcat:
    threads:
      # C9: suma maxConcurrentRequests din politici (acum 50+20+10+4 = 84) rămâne sub plafon, cu rezervă de ~100 de
      # fire pentru health, auth, căutare și cererile respinse imediat de bulkhead (care nu ocupă fire).
      max: 200
      min-spare: 20
    # Conexiuni în așteptare când toate firele sunt ocupate (peste: conexiune refuzată).
    accept-count: 100
spring:
  application:
    name: filegrid-api
  # Upload multipart (C7): fisierul trece printr-un fisier temporar al containerului, sters dupa cerere.
  # Limita aici e cea din nginx; limita pe categorie (4.2) o verifica ingestia (413).
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0
  autoconfigure:
    # Nu vrem parola generata si logata de Spring Security; utilizatorii vin din config la C4.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Loguri JSON structurate pe consola (nativ, Spring Boot 3.4+). MDC-ul (traceId, spanId) apare in JSON.
logging:
  structured:
    format:
      console: logstash

# FileGrid (C4). Secretele vin doar din mediu (.env generat de scripts/start.*); fara valori implicite pentru ele.
filegrid:
  policies:
    # Directorul cu policies/*.yml. In Docker: FILEGRID_POLICY_DIR=/app/policies (montat), recitit fara restart.
    location: ${FILEGRID_POLICY_DIR:classpath:/policies/}
    reload-interval: ${FILEGRID_POLICY_RELOAD_INTERVAL:2s}
  security:
    jwt:
      # HS256, base64, minim 32 de octeti dupa decodare. Fara ea aplicatia nu porneste.
      secret: ${JWT_SECRET:}
      issuer: filegrid
      access-token-ttl: 15m
      refresh-token-ttl: 8h
    # Utilizatorii de test, unul per rol (login minim). Parola goala = utilizator dezactivat.
    users:
      dispecer:
        role: DISPATCH
        password: ${FILEGRID_USER_DISPECER_PASSWORD:}
      teren:
        role: FIELD
        password: ${FILEGRID_USER_TEREN_PASSWORD:}
      racordari:
        role: CONNECTIONS
        password: ${FILEGRID_USER_RACORDARI_PASSWORD:}
      contor:
        role: METER_SERVICE
        password: ${FILEGRID_USER_CONTOR_PASSWORD:}
      admin:
        role: ADMIN
        password: ${FILEGRID_USER_ADMIN_PASSWORD:}
  # Descarcare (C8): link semnat HMAC (cheia vine doar din mediu) si pragul sub care fisierul se verifica inainte de
  # trimitere (peste prag, hash-ul se verifica in timpul trimiterii).
  download:
    link-secret: ${DOWNLOAD_LINK_SECRET:}
    link-ttl: 15m
    pre-verify-max-size: 16MB
  # S3 / MinIO (C5): utilizatorul aplicatiei creat de minio-init (nu contul root). Fara credentiale, S3Adapter
  # porneste neconfigurat (health down, operatiile -> 503). Fara retry in adaptor (rezilienta vine la C11).
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    connect-timeout: 2s
    socket-timeout: 30s
    operation-timeout: 10s
    health-timeout: 2s
    # Obiectele mai mari trec intern prin multipart, cu parti fixe de aceasta marime (minim 5 MiB).
    part-size: 16MB
  # FTP / vsftpd (C6): mod pasiv, conexiune per operatie, fara retry in adaptor (rezilienta vine la C11).
  # Fara credentiale, FtpAdapter porneste neconfigurat (health down, operatiile -> 503).
  ftp:
    host: ${FTP_HOST:}
    port: ${FTP_PORT:21}
    user: ${FTP_USER:}
    password: ${FTP_PASSWORD:}
    connect-timeout: 2s
    control-timeout: 30s
    data-timeout: 30s
    health-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

---
# Profil implicit: FARA baza de date (SQL Server vine la C3). Datasource, JDBC si Flyway sunt dezactivate;
# se activeaza cu profilul "db" (SPRING_PROFILES_ACTIVE=db).
spring:
  config:
    activate:
      on-profile: "!db"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthContributorAutoConfiguration

---
# Profil "db": FileGridMeta pe Microsoft SQL Server + Flyway. Fara valori implicite pentru credentiale:
# daca variabilele lipsesc, aplicatia nu porneste cu acest profil.
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${META_DB_URL}
    username: ${META_DB_USER}
    password: ${META_DB_PASSWORD}
    hikari:
      pool-name: meta
      # C9: pool separat de cel de storage. Metadatele (citiri, sesiuni de upload, audit) sunt scurte; 40 acoperă
      # cererile concurente ale categoriilor cu metadate pe cale, iar peste pool cererea primeste 503 rapid.
      maximum-pool-size: 40
      minimum-idle: 5
      # Fara asteptari lungi cand SQL Server nu raspunde (health si 503 rapide).
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:filesystem:../../db/migrations}
# FileGridStorage (DbStorageAdapter, O3): pool separat, deschis la prima folosire (DataSourceConfig).
filegrid:
  storage-db:
    url: ${STORAGE_DB_URL}
    username: ${STORAGE_DB_USER}
    password: ${STORAGE_DB_PASSWORD}
    hikari:
      pool-name: storage
      # C9: pool separat (FileGridStorage); mai mic, fiindcă tine conexiunea cat dureaza scrierea/citirea continutului.
      maximum-pool-size: 30
      minimum-idle: 2
      # Lasă timp pentru SELECT 1 în bugetul total de 2 s al verificării health.
      connection-timeout: 750
      validation-timeout: 500
      initialization-fail-timeout: -1
      data-source-properties:
        loginTimeout: 2
        connectRetryCount: 0
        lockTimeout: 1000
        cancelQueryTimeout: 1
        socketTimeout: 6000
        responseBuffering: adaptive
      # Opțiunile JDBC necesare pentru scrieri într-o tabelă cu index filtrat.
      connection-init-sql: >-
        SET ANSI_NULLS ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON;
        SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON;
        SET QUOTED_IDENTIFIER ON; SET NUMERIC_ROUNDABORT OFF;

# Thresholds of the 4 business requirements, served by GET /api/v1/stats/requirements.
# The Prometheus alert rules use the same values; keep both in sync when changing them.
window: 5m                      # window for R2, R3 and R4
minSamples: 5                   # R2 and R4: fewer samples than this in the window means insufficient data (status OK)
readings:                       # R1
  unconfirmedMax: 0             # filegrid_meter_unconfirmed (rows without file_id older than 60 s)
outages:                        # R2
  p95MaxSeconds: 2.0
documents:                      # R3
  deniedMax: 0                  # denied CONNECTION_DOC access within the window
videos:                         # R4
  failedMaxPercent: 5.0

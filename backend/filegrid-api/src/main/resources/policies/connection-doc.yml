# Category policy (4.2). Read by PolicyEngine and hot-reloaded without restart (within ~2 s).
# Fields: category (METER_READING | OUTAGE_RECORD | CONNECTION_DOC | INSPECTION_VIDEO), primaryStorage and
# fallbackStorage (FTP | S3 | DB, must differ), maxSize (bytes or with a binary unit: KB, MB, GB; 1 KB = 1024 B),
# encryption (true | false), chunkSize (optional, chunked uploads only: 5MiB..64MiB),
# maxConcurrentRequests (parallel requests per instance, bulkhead). On reload, an unknown field or invalid value
# is logged and the previous policy is kept.
# Connection documents are AES-GCM encrypted before they reach storage (C10).
category: CONNECTION_DOC
primaryStorage: DB
fallbackStorage: S3
maxSize: 20MB
encryption: true
maxConcurrentRequests: 10

# FileGrid PPC - Docker Compose entry point (ADR-002). Start it with ./scripts/start.sh or
# .\scripts\start.ps1 (creates .env with random secrets, then runs `docker compose up -d --build`).
# Requires Docker Compose >= 2.20 (for `include`). The stack itself is in infra/docker/docker-compose.yml.
#
# Development (ports bound to 127.0.0.1 only, e.g. SQL Server 1433 for SSMS):
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.dev.yml up -d
# Reset the demo (removes the named volumes):
#   docker compose down -v
name: filegrid

include:
  - path: infra/docker/docker-compose.yml

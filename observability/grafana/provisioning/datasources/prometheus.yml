# Prometheus datasource (F7). The `prometheus` service (port 9090, 5 s scrape) comes from O8; the fixed uid
# `prometheus` is referenced by dashboards and alert rules, so do not change it.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      prometheusType: Prometheus

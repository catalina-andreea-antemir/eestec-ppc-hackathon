# Datasource-ul Prometheus (F7). Serviciul `prometheus` (port 9090, scrape 5 s) vine din O8; uid-ul fix `prometheus`
# e folosit de dashboard-uri si de regulile de alerta, deci nu se schimba.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      prometheusType: Prometheus

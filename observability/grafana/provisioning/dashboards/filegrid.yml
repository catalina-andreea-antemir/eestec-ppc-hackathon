# Dashboard-urile FileGrid (F7): fisierele JSON din observability/grafana/dashboards, montate read-only in container.
# Alertele 1-4 sunt reguli Prometheus + Alertmanager (O8, observability/prometheus/rules), nu alerte Grafana.
apiVersion: 1

providers:
  - name: filegrid
    orgId: 1
    folder: FileGrid
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

# FileGrid dashboards (F7): JSON files from observability/grafana/dashboards, mounted read-only.
# Alerts 1-4 are Prometheus + Alertmanager rules (O8, observability/prometheus/rules), not Grafana alerts.
apiVersion: 1

providers:
  - name: filegrid
    orgId: 1
    folder: FileGrid
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

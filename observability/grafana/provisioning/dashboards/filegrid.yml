# Dashboard-urile FileGrid (F7): fisierele JSON din observability/grafana/dashboards, montate read-only in container.
# Fara folderUid: folderul se cauta dupa titlu, ca sa fie acelasi cu cel creat de alerting/filegrid-alerte.yml
# (provisioning-ul de alerte ruleaza primul).
apiVersion: 1

providers:
  - name: filegrid
    orgId: 1
    folder: FileGrid
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

# Alertele de business 1-4 (F7), provisionate in Grafana pe datasource-ul Prometheus (uid `prometheus`).
#
# Notificarea obligatorie (webhook catre alert-webhook, group_wait 10s) e facuta de Prometheus + Alertmanager (O8), pe
# aceleasi expresii; aici alertele sunt vizibile in Grafana (Alerting -> Alert rules, folderul FileGrid) si pe
# dashboard-ul "FileGrid – Cerinte de business si contoare". Fara contact point propriu: politica implicita Grafana.
#
# Praguri (planul v4, 4.1 "Cerintele de business", aceleasi ca resources/requirements.yml):
#   1. citiri:    max(filegrid_meter_unconfirmed) > 0, sau citiri abandonate in 5 min, sau sim_readings_pending > 0
#                 continuu 2 minute (nu se compara direct trimise cu confirmate);
#   2. avarii:    p95 pe OUTAGE_RECORD peste 2 s, pe ultimele 5 minute;
#   3. video:     peste 5% transferuri INSPECTION_VIDEO esuate in 5 minute. Alegere F7 (pragul de raport nu e fixat
#                 in contract): esuate / (esuate + upload_complete si download reusite);
#   4. documente: orice filegrid_doc_access_total{result!="ok"} in ultimele 5 minute.
# Evaluare la 10 s (minimul Grafana; Prometheus din O8 evalueaza la 5 s) si `for: 15s`, ca alerta sa porneasca in
# sub un minut.
# Folderul se cauta dupa titlu: e acelasi folder "FileGrid" ca al dashboard-urilor (dashboards/filegrid.yml).
# noDataState OK: pana la C12 / O8 metricile lipsesc, iar lipsa lor nu e o incalcare.
apiVersion: 1

groups:
  - orgId: 1
    name: filegrid-cerinte-business
    folder: FileGrid
    interval: 10s
    rules:
      - uid: filegrid-alerta-1-citiri
        title: "Alerta 1 – citiri neconfirmate"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (max(filegrid_meter_unconfirmed) > 0)
                or (sum(increase(sim_readings_abandoned_total[5m])) > 0)
                or (min_over_time(sum(sim_readings_pending)[2m:5s]) > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 15s
        labels: { severity: critical, alerta: "1", categorie: METER_READING }
        annotations:
          summary: "Citiri de contor neconfirmate sau abandonate"
          description: >-
            Exista randuri fara file_id mai vechi de 60 s, citiri abandonate de simulator in ultimele 5 minute
            sau citiri in curs de peste 2 minute. Valoare: {{ with $values.A }}{{ .Value }}{{ else }}n/a{{ end }}.
          __dashboardUid__: filegrid-cerinte
          __panelId__: "3"

      - uid: filegrid-alerta-2-avarii-p95
        title: "Alerta 2 – p95 avarii peste 2 s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(filegrid_operation_seconds_bucket{category="OUTAGE_RECORD", operation!="health"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
        noDataState: OK
        execErrState: Error
        for: 15s
        labels: { severity: warning, alerta: "2", categorie: OUTAGE_RECORD }
        annotations:
          summary: "Latenta p95 pe inregistrarile de avarie depaseste 2 s"
          description: "p95 OUTAGE_RECORD pe ultimele 5 minute: {{ with $values.A }}{{ humanizeDuration .Value }}{{ else }}n/a{{ end }} (prag 2 s)."
          __dashboardUid__: filegrid-cerinte
          __panelId__: "4"

      - uid: filegrid-alerta-3-video
        title: "Alerta 3 – transferuri video esuate"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                sum(increase(filegrid_transfers_failed_total{category="INSPECTION_VIDEO"}[5m]))
                / clamp_min(
                  sum(increase(filegrid_transfers_failed_total{category="INSPECTION_VIDEO"}[5m]))
                  + (sum(increase(filegrid_operation_seconds_count{category="INSPECTION_VIDEO",
                       operation=~"upload_complete|download", outcome="ok"}[5m])) or vector(0)),
                  1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        noDataState: OK
        execErrState: Error
        for: 15s
        labels: { severity: warning, alerta: "3", categorie: INSPECTION_VIDEO }
        annotations:
          summary: "Peste 5% transferuri video esuate"
          description: "Transferuri INSPECTION_VIDEO esuate in ultimele 5 minute: {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}n/a{{ end }} (prag 5%)."
          __dashboardUid__: filegrid-cerinte
          __panelId__: "6"

      - uid: filegrid-alerta-4-documente
        title: "Alerta 4 – acces neasteptat la documente"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(increase(filegrid_doc_access_total{result!="ok"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 15s
        labels: { severity: critical, alerta: "4", categorie: CONNECTION_DOC }
        annotations:
          summary: "Acces refuzat sau eroare la documentele de racordare"
          description: "Accese la documente cu result != ok in ultimele 5 minute: {{ with $values.A }}{{ .Value }}{{ else }}n/a{{ end }}."
          __dashboardUid__: filegrid-cerinte
          __panelId__: "5"

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml
  sync_period: 2s

clients:
  - url: http://loki:3100/loki/api/v1/push

target_config:
  sync_period: 2s

scrape_configs:
  - job_name: filegrid-api
    static_configs:
      - targets: [localhost]
        labels:
          job: filegrid-api
          __path__: /var/log/filegrid/api-*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '^/var/log/filegrid/api-(?P<replica>[^.]+)\.\d{4}-\d{2}-\d{2}\.\d+\.log$'
      - labels:
          replica:
      - json:
          expressions:
            timestamp: '"@timestamp"'
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/minio-auth/token
    static_configs:
      - targets: [minio:9000]

  - job_name: api
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
        refresh_interval: 5s

  # The sim profile is optional. Docker DNS only resolves the target while the simulator is running.
  - job_name: meter-simulator
    metrics_path: /metrics
    dns_sd_configs:
      - names: [meter-simulator]
        type: A
        port: 9400
        refresh_interval: 5s

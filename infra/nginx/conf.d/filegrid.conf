# FileGrid PPC - intrarea in sistem (C3; planul v4 4.1; ADR-002, ADR-003, ADR-004).
#   80  -> redirect la HTTPS
#   443 -> interfata Angular (static), /api/v1 -> api, /grafana/ -> grafana (cand exista)
# /actuator NU se proxiaza (ramane doar pe reteaua interna, pentru Prometheus).

# DNS-ul Docker, re-rezolvat la 5 s: cu `--scale api=3` fiecare instanta noua intra in rotatie (C14), iar nginx
# porneste si cand api sau grafana inca nu exista (numele se rezolva la cerere, prin variabile in proxy_pass).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Bucati de pana la 64 MiB (ADR-003) si fisiere mici de pana la 20 MB.
    client_max_body_size 100m;
    client_body_timeout 300s;
    send_timeout 300s;

    set $api_upstream http://api:8080;
    set $grafana_upstream http://grafana:3000;

    # Antete comune pentru proxy (mostenite de location-urile fara proxy_set_header propriu).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # Daca api nu raspunde (sau o instanta tocmai a disparut), nu se repeta cererile care nu sunt idempotente.
    proxy_next_upstream error timeout;

    # --- API ---------------------------------------------------------------------------------------------------
    # Descarcarea prin link semnat (ADR-004): tokenul e in cale, deci fara access_log; streaming fara buffer.
    location ^~ /api/v1/downloads/ {
        access_log off;
        proxy_buffering off;
        proxy_pass $api_upstream;
    }

    # Upload (mic si in bucati) si descarcare directa: corpul merge in streaming catre api, fara fisier temporar
    # in nginx, iar raspunsul (GET /files/{id}/download) se trimite fara buffer.
    location ~ ^/api/v1/(uploads|files)(/|$) {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass $api_upstream;
    }

    location ^~ /api/v1/ {
        proxy_pass $api_upstream;
    }

    # Orice alta cale /api/... (sau /actuator) nu ajunge la api si nu cade nici pe index.html.
    location ^~ /api/ {
        return 404;
    }
    location ^~ /actuator {
        return 404;
    }

    # --- Grafana (F7) ------------------------------------------------------------------------------------------
    # Pregatita: Grafana ruleaza cu GF_SERVER_SERVE_FROM_SUB_PATH=true si root_url .../grafana/. Pana exista
    # serviciul, numele nu se rezolva si raspunsul e 503.
    location = /grafana {
        return 301 /grafana/;
    }
    location ^~ /grafana/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $grafana_upstream;
        error_page 502 504 =503 /grafana-unavailable;
    }
    location = /grafana-unavailable {
        internal;
        default_type text/plain;
        return 503 "Grafana nu ruleaza inca.\n";
    }

    # --- Interfata Angular ---------------------------------------------------------------------------------------
    root /usr/share/nginx/html;

    # Fisierele cu hash in nume (main-XXXX.js, styles-XXXX.css) se pot tine in cache mult.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fallback la index.html pentru rutele Angular (/login, /upload, ...); index.html nu se tine in cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }
}

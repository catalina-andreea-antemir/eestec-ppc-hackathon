# FileGrid PPC - system entry point (C3; ADR-002, ADR-003, ADR-004).
#   80  -> redirect to HTTPS
#   443 -> Angular UI (static), /api/v1 -> api, /grafana/ -> grafana
# /actuator is NOT proxied (internal network only, for Prometheus).

# Docker DNS, re-resolved every 5 s: with `--scale api=3` each new instance joins the rotation (C14), and nginx
# starts even when api or grafana do not exist yet (names are resolved per request via variables in proxy_pass).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Chunks up to 64 MiB (ADR-003) and small files up to 20 MB.
    client_max_body_size 100m;
    client_body_timeout 300s;
    send_timeout 300s;

    set $api_upstream http://api:8080;
    set $grafana_upstream http://grafana:3000;

    # Common proxy headers (inherited by locations without their own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # If api does not answer (or an instance just went away), non-idempotent requests are not retried.
    proxy_next_upstream error timeout;

    # --- API ---------------------------------------------------------------------------------------------------
    # Signed-link download (ADR-004): the token is in the path, so no access_log; unbuffered streaming.
    location ^~ /api/v1/downloads/ {
        access_log off;
        proxy_buffering off;
        proxy_pass $api_upstream;
    }

    # Uploads (small and chunked) and direct downloads: the body streams to api with no nginx temp file,
    # and the response (GET /files/{id}/download) is sent unbuffered.
    location ~ ^/api/v1/(uploads|files)(/|$) {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass $api_upstream;
    }

    location ^~ /api/v1/ {
        proxy_pass $api_upstream;
    }

    # Any other /api/... path (or /actuator) never reaches api and does not fall back to index.html either.
    location ^~ /api/ {
        return 404;
    }
    location ^~ /actuator {
        return 404;
    }

    # --- Grafana (F7) ------------------------------------------------------------------------------------------
    # Grafana runs with GF_SERVER_SERVE_FROM_SUB_PATH=true and root_url .../grafana/. If the service is not
    # running, the name does not resolve and the response is 503.
    location = /grafana {
        return 301 /grafana/;
    }
    location ^~ /grafana/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $grafana_upstream;
        error_page 502 504 =503 /grafana-unavailable;
    }
    location = /grafana-unavailable {
        internal;
        default_type text/plain;
        return 503 "Grafana nu ruleaza inca.\n";
    }

    # --- Angular UI ----------------------------------------------------------------------------------------------
    root /usr/share/nginx/html;

    # Files with a hash in the name (main-XXXX.js, styles-XXXX.css) can be cached for a long time.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fallback to index.html for Angular routes (/login, /upload, ...); index.html itself is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }
}

# nginx principal (C3). Configuratia FileGrid este in conf.d/filegrid.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cererile se logheaza cu X-Trace-Id-ul raspunsului, ca sa se poata lega de logurile api, si cu instanta api care
    # a raspuns (upstream=IP:port), ca distributia pe replici sa se vada (C14).
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time trace=$upstream_http_x_trace_id '
                    'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Pentru proxy_set_header Connection (WebSocket la Grafana Live, keep-alive in rest).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}

# FileGrid PPC - stack-ul Docker Compose (planul v4, sectiunile 4 si 4.1, ADR-001, ADR-002).
#
# Nu se porneste direct de aici: docker-compose.yml din radacina repo-ului face include la acest fisier, iar
# scripts/start.sh / scripts/start.ps1 creeaza .env (secrete aleatorii) si ruleaza `docker compose up -d --build`.
# Caile relative din acest fisier sunt relative la infra/docker/.
#
# Retele: storage-net este interna (fara porturi publicate, fara iesire in exterior); public este doar pentru nginx,
# singurul serviciu cu porturi publicate (80 -> redirect HTTPS, 443).
#
# Memorie (4.1, 8 GB in Docker): mssql 2,5 GB, api 3 x 512 MB, minio 512 MB, prometheus 512 MB, loki 512 MB,
# grafana 256 MB, simulator 256 MB, restul ~600 MB (total ~7,1 GB). Se verifica la ora 8 cu `docker stats`.

x-sqlcmd-healthcheck: &sqlcmd-healthcheck
  # Parola trece prin SQLCMDPASSWORD, nu prin linia de comanda (-P).
  test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 3 -b -Q 'SET NOCOUNT ON; SELECT 1' -o /dev/null"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 30s
  start_interval: 3s

services:
  # ---------------------------------------------------------------------------------------------------------------
  # Intrarea: TLS, build-ul Angular, proxy catre api (si /grafana cand exista Grafana).
  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    image: filegrid/nginx:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
    networks:
      - public
      - storage-net
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Contract (/health): drumul complet nginx -> api -> FileGridMeta.
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Aplicatia Spring Boot. Fara container_name si fara porturi publicate, ca `--scale api=3` sa mearga (C14).
  api:
    build:
      context: ../..
      dockerfile: backend/filegrid-api/Dockerfile
    image: filegrid/api:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: db
      SERVER_PORT: "8080"
      # FileGridMeta: Flyway (db/migrations copiat in imagine, FLYWAY_LOCATIONS setat in Dockerfile).
      META_DB_URL: "jdbc:sqlserver://mssql:1433;databaseName=FileGridMeta;encrypt=true;trustServerCertificate=true"
      META_DB_USER: filegrid_meta_app
      META_DB_PASSWORD: ${META_DB_PASSWORD}
      # FileGridStorage (folosit de DbStorageAdapter, O3). STORAGE_DB_HOST=mssql-storage in profilul split.
      STORAGE_DB_URL: "jdbc:sqlserver://${STORAGE_DB_HOST:-mssql}:1433;databaseName=FileGridStorage;encrypt=true;trustServerCertificate=true;responseBuffering=adaptive"
      STORAGE_DB_USER: filegrid_storage_app
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      # S3 (MinIO), cu utilizatorul aplicatiei creat de minio-init (nu contul root).
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET:-filegrid}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # FTP, mod pasiv, pe reteaua interna.
      FTP_HOST: ftp
      FTP_PORT: "21"
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
      # Securitate (C4, C10): cheia JWT, cheia AES-GCM pentru CONNECTION_DOC, cheia HMAC a link-urilor semnate (C8).
      JWT_SECRET: ${JWT_SECRET}
      DOC_ENCRYPTION_KEY: ${DOC_ENCRYPTION_KEY}
      DOWNLOAD_LINK_SECRET: ${DOWNLOAD_LINK_SECRET}
      # Utilizatorii de test (unul per rol), cu parolele generate in .env (login minim, C4).
      FILEGRID_USER_DISPECER_PASSWORD: ${FILEGRID_USER_DISPECER_PASSWORD:-}
      FILEGRID_USER_TEREN_PASSWORD: ${FILEGRID_USER_TEREN_PASSWORD:-}
      FILEGRID_USER_RACORDARI_PASSWORD: ${FILEGRID_USER_RACORDARI_PASSWORD:-}
      FILEGRID_USER_CONTOR_PASSWORD: ${FILEGRID_USER_CONTOR_PASSWORD:-}
      FILEGRID_USER_ADMIN_PASSWORD: ${FILEGRID_USER_ADMIN_PASSWORD:-}
      # Politica per categorie (4.2): directorul din repo, montat read-only; PolicyEngine il reciteste fara restart.
      FILEGRID_POLICY_DIR: /app/policies
      LOGGING_CONFIG: /etc/filegrid/logback-spring.xml
      # Heap-ul din procent, ca limita containerului (512 MB) sa ramana sub control.
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ../../backend/filegrid-api/src/main/resources/policies:/app/policies:ro
      - ../../observability/promtail/logback-spring.xml:/etc/filegrid/logback-spring.xml:ro
      - api-logs:/var/log/filegrid
    networks:
      - storage-net
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ftp:
        condition: service_healthy
      api-logs-init:
        condition: service_completed_successfully
    healthcheck:
      # GET /api/v1/health (contract): UP doar cand api si FileGridMeta raspund (storage-urile nu intra aici).
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
      start_interval: 3s
    mem_limit: 512m

  # ---------------------------------------------------------------------------------------------------------------
  # SQL Server 2022: un singur container cu FileGridMeta si FileGridStorage (ADR-001).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql:/var/opt/mssql
    networks:
      - storage-net
    healthcheck: *sqlcmd-healthcheck
    mem_limit: 2560m

  # Ruleaza o singura data scripturile lui Ovidiu (infra/mssql): baze, utilizatori cu drepturi minime, blob_chunks.
  # Idempotent, iese cu cod 0. Aceeasi imagine ca mssql (are bash, iconv, od si sqlcmd din mssql-tools18).
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    entrypoint: ["bash", "/init/init.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      META_DB_PASSWORD: ${META_DB_PASSWORD}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      STORAGE_DB_HOST: ${STORAGE_DB_HOST:-mssql}
      # Gol = aceeasi parola sa ca la mssql (init.sh o ia implicit din MSSQL_SA_PASSWORD).
      STORAGE_DB_SA_PASSWORD: ${STORAGE_DB_SA_PASSWORD:-}
    volumes:
      - ../mssql:/init:ro
    networks:
      - storage-net
    depends_on:
      mssql:
        condition: service_healthy
      mssql-storage:
        condition: service_healthy
        required: false
    mem_limit: 256m

  # Profil split (ADR-001): al doilea SQL Server, doar pentru FileGridStorage. Se activeaza cu
  # STORAGE_DB_HOST=mssql-storage in .env si `docker compose --profile split up -d`.
  mssql-storage:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["split"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${STORAGE_DB_SA_PASSWORD:-${MSSQL_SA_PASSWORD}}
    volumes:
      - mssql-storage:/var/opt/mssql
    networks:
      - storage-net
    healthcheck: *sqlcmd-healthcheck
    mem_limit: 2560m

  # ---------------------------------------------------------------------------------------------------------------
  # S3: MinIO. Imaginea minio/minio nu se mai publica pe Docker Hub/quay.io; chainguard/minio are doar tag-ul latest
  # gratuit, deci e fixata pe digest (MinIO RELEASE.2026-11-12T01-15-23Z).
  minio:
    image: chainguard/minio:latest@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: jwt
      # Tine runtime-ul Go sub mem_limit.
      GOMEMLIMIT: 400MiB
    volumes:
      - minio:/data
      - ../minio:/config:ro
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "bash", "/config/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
      start_interval: 2s
    mem_limit: 512m

  # Creeaza bucket-ul si utilizatorul aplicatiei (politica limitata la bucket). Idempotent, iese cu cod 0.
  minio-init:
    image: chainguard/minio:latest@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    restart: "no"
    entrypoint: ["bash", "/config/init-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-filegrid}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ../minio:/config:ro
    networks:
      - storage-net
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Provisioning separat pentru identitatea Prometheus, fara acces la bucketul aplicatiei.
  minio-metrics-init:
    image: chainguard/minio:latest@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    user: "0:0"
    restart: "no"
    entrypoint: ["bash", "/config/init-prometheus.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../minio:/config:ro
      - minio-metrics-auth:/metrics-auth
    networks:
      - storage-net
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # FTP: vsftpd (infra/ftp), mod pasiv; porturile pasive 21000-21049 exista doar in storage-net.
  ftp:
    build:
      context: ../ftp
    image: filegrid/ftp:local
    restart: unless-stopped
    # vsftpd ca PID 1 se prabuseste (SIGSEGV, exit 139) dupa cateva sute de conexiuni; cu init (tini) rezista.
    init: true
    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
    volumes:
      - ftp:/srv/ftp
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/ftp-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
      start_interval: 2s
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Prometheus (O8): scrape separat pentru fiecare replica api, prin DNS-ul Docker.
  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    # Pe reteaua interna, ndots explicit face Docker sa raspunda fara inregistrari pentru numele local absent.
    # Astfel DNS SD elimina tinta simulatorului in loc sa pastreze ultima adresa dupa SERVFAIL.
    dns_opt: ["ndots:1"]
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
      - minio-metrics-auth:/etc/prometheus/minio-auth:ro
    networks:
      - storage-net
    depends_on:
      minio-metrics-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  # ---------------------------------------------------------------------------------------------------------------
  # Notificarile O8 raman in reteaua interna.
  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 128m

  alert-webhook:
    build:
      context: ../../observability/alert-webhook
    image: filegrid/alert-webhook:local
    restart: unless-stopped
    init: true
    read_only: true
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 64m

  # ---------------------------------------------------------------------------------------------------------------
  # Pregateste volumele noi pentru UID-ul neprivilegiat folosit de api si promtail.
  api-logs-init:
    image: busybox:1.37.0-musl
    restart: "no"
    network_mode: none
    command: ["sh", "-ec", "chown 10001:10001 /var/log/filegrid /var/lib/promtail && chmod 0750 /var/log/filegrid /var/lib/promtail"]
    volumes:
      - api-logs:/var/log/filegrid
      - promtail-positions:/var/lib/promtail
    mem_limit: 16m

  loki:
    build:
      context: ../../observability/loki
    image: filegrid/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      GOMEMLIMIT: 384MiB
    volumes:
      - ../../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  promtail:
    build:
      context: ../../observability/promtail
    image: filegrid/promtail:3.6.11
    restart: unless-stopped
    read_only: true
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../../observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - api-logs:/var/log/filegrid:ro
      - promtail-positions:/var/lib/promtail
    networks:
      - storage-net
    depends_on:
      api-logs-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Grafana (F7): dashboard-uri si alerte provisionate din observability/grafana (apar singure la pornire). Fara port
  # publicat: se vede doar prin nginx, la https://localhost/grafana/ (utilizator admin, parola din .env). Datasource-ul
  # Prometheus foloseste serviciul intern `prometheus` pe portul 9090.
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # storage-net nu are iesire in exterior: fara verificari de update si telemetrie.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/filegrid-operatii.json
    volumes:
      - grafana:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 3s
    mem_limit: 256m
  meter-simulator:   # O5 - profil sim: docker compose --profile sim up meter-simulator
    profiles: ["sim"]
    build:
      context: ../../simulator/meter-simulator
    image: filegrid/meter-simulator:local
    environment:
      SIM_PROFILE: ${SIM_PROFILE:-normal}
      SIM_API_BASE_URL: http://api:8080/api/v1
      METER_SERVICE_USERNAME: contor
      METER_SERVICE_PASSWORD: ${FILEGRID_USER_CONTOR_PASSWORD:-}
    networks:
      - storage-net
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
  # toxiproxy:       # F9 - profiles: ["chaos"]; singurul port, publicat doar pe 127.0.0.1; retelele public si storage-net

networks:
  # Interna: storage-urile, api si (mai tarziu) observabilitatea. Fara porturi publicate si fara iesire in exterior.
  storage-net:
    internal: true
  # Publica: doar nginx (si toxiproxy in profilul chaos, pe 127.0.0.1).
  public: {}

volumes:
  mssql:
  mssql-storage:
  minio:
  ftp:
  nginx-certs:
  grafana:
  prometheus:
  minio-metrics-auth:
  alertmanager:
  loki:
  api-logs:
  promtail-positions:

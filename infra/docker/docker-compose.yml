# FileGrid PPC - Docker Compose stack (ADR-001, ADR-002).
#
# Not started directly: the root docker-compose.yml includes this file, and scripts/start.sh / scripts/start.ps1
# create .env (random secrets) and run `docker compose up -d --build`. Relative paths here are relative to infra/docker/.
#
# Networks: storage-net is internal (no published ports, no egress); public is only for nginx,
# the single service with published ports (80 -> HTTPS redirect, 443).
#
# Memory budget (8 GB for Docker): mssql 2.5 GB, api 3 x 512 MB, minio 512 MB, prometheus 512 MB, loki 512 MB,
# grafana 256 MB, simulator 256 MB, the rest ~600 MB (total ~7.1 GB). Check with `docker stats`.

x-sqlcmd-healthcheck: &sqlcmd-healthcheck
  # The password goes through SQLCMDPASSWORD, not the command line (-P), so it never shows in the process list.
  test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 3 -b -Q 'SET NOCOUNT ON; SELECT 1' -o /dev/null"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 30s
  start_interval: 3s

services:
  # ---------------------------------------------------------------------------------------------------------------
  # Entry point: TLS, the Angular build, proxy to api (and /grafana).
  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    image: filegrid/nginx:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
    networks:
      - public
      - storage-net
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Contract /health: full path nginx -> api -> FileGridMeta.
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Spring Boot app. No container_name and no published ports, so `--scale api=3` works (C14).
  api:
    build:
      context: ../..
      dockerfile: backend/filegrid-api/Dockerfile
    image: filegrid/api:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: db
      SERVER_PORT: "8080"
      # FileGridMeta: Flyway (db/migrations baked into the image, FLYWAY_LOCATIONS set in the Dockerfile).
      META_DB_URL: "jdbc:sqlserver://mssql:1433;databaseName=FileGridMeta;encrypt=true;trustServerCertificate=true"
      META_DB_USER: filegrid_meta_app
      META_DB_PASSWORD: ${META_DB_PASSWORD}
      # FileGridStorage (used by DbStorageAdapter, O3). STORAGE_DB_HOST=mssql-storage in the split profile.
      STORAGE_DB_URL: "jdbc:sqlserver://${STORAGE_DB_HOST:-mssql}:1433;databaseName=FileGridStorage;encrypt=true;trustServerCertificate=true;responseBuffering=adaptive"
      STORAGE_DB_USER: filegrid_storage_app
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      # S3 (MinIO) with the app user created by minio-init (not the root account).
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET:-filegrid}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # FTP, passive mode, on the internal network.
      FTP_HOST: ftp
      FTP_PORT: "21"
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
      # Security (C4, C10): JWT key, AES-GCM key for CONNECTION_DOC, HMAC key for signed links (C8).
      JWT_SECRET: ${JWT_SECRET}
      DOC_ENCRYPTION_KEY: ${DOC_ENCRYPTION_KEY}
      DOWNLOAD_LINK_SECRET: ${DOWNLOAD_LINK_SECRET}
      # Test users (one per role) with the passwords generated in .env (minimal login, C4).
      FILEGRID_USER_DISPECER_PASSWORD: ${FILEGRID_USER_DISPECER_PASSWORD:-}
      FILEGRID_USER_TEREN_PASSWORD: ${FILEGRID_USER_TEREN_PASSWORD:-}
      FILEGRID_USER_RACORDARI_PASSWORD: ${FILEGRID_USER_RACORDARI_PASSWORD:-}
      FILEGRID_USER_CONTOR_PASSWORD: ${FILEGRID_USER_CONTOR_PASSWORD:-}
      FILEGRID_USER_ADMIN_PASSWORD: ${FILEGRID_USER_ADMIN_PASSWORD:-}
      # Per-category policy (4.2): repo directory mounted read-only; PolicyEngine reloads it without restart.
      FILEGRID_POLICY_DIR: /app/policies
      LOGGING_CONFIG: /etc/filegrid/logback-spring.xml
      # Heap sized as a percentage so the container limit (512 MB) is respected.
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ../../backend/filegrid-api/src/main/resources/policies:/app/policies:ro
      - ../../observability/promtail/logback-spring.xml:/etc/filegrid/logback-spring.xml:ro
      - api-logs:/var/log/filegrid
    networks:
      - storage-net
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ftp:
        condition: service_healthy
      api-logs-init:
        condition: service_completed_successfully
    healthcheck:
      # GET /api/v1/health (contract): UP only when api and FileGridMeta respond (storage backends are not included).
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
      start_interval: 3s
    mem_limit: 512m

  # ---------------------------------------------------------------------------------------------------------------
  # SQL Server 2022: a single container holding FileGridMeta and FileGridStorage (ADR-001).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql:/var/opt/mssql
    networks:
      - storage-net
    healthcheck: *sqlcmd-healthcheck
    mem_limit: 2560m

  # One-shot run of infra/mssql: databases, least-privilege users, blob_chunks.
  # Idempotent, exits 0. Same image as mssql (it ships bash, iconv, od and sqlcmd from mssql-tools18).
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    entrypoint: ["bash", "/init/init.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      META_DB_PASSWORD: ${META_DB_PASSWORD}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      STORAGE_DB_HOST: ${STORAGE_DB_HOST:-mssql}
      # Empty = same sa password as mssql (init.sh defaults to MSSQL_SA_PASSWORD).
      STORAGE_DB_SA_PASSWORD: ${STORAGE_DB_SA_PASSWORD:-}
    volumes:
      - ../mssql:/init:ro
    networks:
      - storage-net
    depends_on:
      mssql:
        condition: service_healthy
      mssql-storage:
        condition: service_healthy
        required: false
    mem_limit: 256m

  # Split profile (ADR-001): a second SQL Server just for FileGridStorage. Enabled with
  # STORAGE_DB_HOST=mssql-storage in .env and `docker compose --profile split up -d`.
  mssql-storage:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["split"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${STORAGE_DB_SA_PASSWORD:-${MSSQL_SA_PASSWORD}}
    volumes:
      - mssql-storage:/var/opt/mssql
    networks:
      - storage-net
    healthcheck: *sqlcmd-healthcheck
    mem_limit: 2560m

  # ---------------------------------------------------------------------------------------------------------------
  # S3: MinIO. minio/minio is no longer published on Docker Hub/quay.io; chainguard/minio only offers a free
  # `latest` tag, so it is pinned by digest (MinIO RELEASE.2026-11-12T01-15-23Z).
  minio:
    image: chainguard/minio:latest@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: jwt
      # Keeps the Go runtime below mem_limit.
      GOMEMLIMIT: 400MiB
    volumes:
      - minio:/data
      - ../minio:/config:ro
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "bash", "/config/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
      start_interval: 2s
    mem_limit: 512m

  # Creates the bucket and the app user (policy scoped to that bucket). Idempotent, exits 0.
  minio-init:
    image: chainguard/minio:latest@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    restart: "no"
    entrypoint: ["bash", "/config/init-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-filegrid}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ../minio:/config:ro
    networks:
      - storage-net
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Separate provisioning for the Prometheus identity, with no access to the app bucket.
  minio-metrics-init:
    image: chainguard/minio:latest@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    user: "0:0"
    restart: "no"
    entrypoint: ["bash", "/config/init-prometheus.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../minio:/config:ro
      - minio-metrics-auth:/metrics-auth
    networks:
      - storage-net
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # FTP: vsftpd (infra/ftp), passive mode; passive ports 21000-21049 exist only on storage-net.
  ftp:
    build:
      context: ../ftp
    image: filegrid/ftp:local
    restart: unless-stopped
    # vsftpd as PID 1 crashes (SIGSEGV, exit 139) after a few hundred connections; it is stable under an init (tini).
    init: true
    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
    volumes:
      - ftp:/srv/ftp
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/ftp-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
      start_interval: 2s
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Prometheus (O8): one scrape target per api replica, discovered through Docker DNS.
  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    # On the internal network an explicit ndots makes Docker answer NXDOMAIN for the absent local name, so DNS SD
    # drops the simulator target instead of keeping its last address after a SERVFAIL.
    dns_opt: ["ndots:1"]
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
      - minio-metrics-auth:/etc/prometheus/minio-auth:ro
    networks:
      - storage-net
    depends_on:
      minio-metrics-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  # ---------------------------------------------------------------------------------------------------------------
  # O8 notifications stay on the internal network.
  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 128m

  alert-webhook:
    build:
      context: ../../observability/alert-webhook
    image: filegrid/alert-webhook:local
    restart: unless-stopped
    init: true
    read_only: true
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 64m

  # ---------------------------------------------------------------------------------------------------------------
  # Prepares fresh volumes for the unprivileged UID used by api and promtail.
  api-logs-init:
    image: busybox:1.37.0-musl
    restart: "no"
    network_mode: none
    command: ["sh", "-ec", "chown 10001:10001 /var/log/filegrid /var/lib/promtail && chmod 0750 /var/log/filegrid /var/lib/promtail"]
    volumes:
      - api-logs:/var/log/filegrid
      - promtail-positions:/var/lib/promtail
    mem_limit: 16m

  loki:
    build:
      context: ../../observability/loki
    image: filegrid/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      GOMEMLIMIT: 384MiB
    volumes:
      - ../../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  promtail:
    build:
      context: ../../observability/promtail
    image: filegrid/promtail:3.6.11
    restart: unless-stopped
    read_only: true
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../../observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - api-logs:/var/log/filegrid:ro
      - promtail-positions:/var/lib/promtail
    networks:
      - storage-net
    depends_on:
      api-logs-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 128m

  # ---------------------------------------------------------------------------------------------------------------
  # Grafana (F7): dashboards and alerts provisioned from observability/grafana. No published port:
  # reachable only through nginx at https://localhost/grafana/ (user admin, password in .env). The Prometheus
  # datasource uses the internal `prometheus` service on port 9090.
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # storage-net has no egress: disable update checks and telemetry.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/filegrid-operatii.json
    volumes:
      - grafana:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 3s
    mem_limit: 256m
  meter-simulator:   # O5 - sim profile: docker compose --profile sim up meter-simulator
    profiles: ["sim"]
    build:
      context: ../../simulator/meter-simulator
    image: filegrid/meter-simulator:local
    environment:
      SIM_PROFILE: ${SIM_PROFILE:-normal}
      SIM_API_BASE_URL: http://api:8080/api/v1
      METER_SERVICE_USERNAME: contor
      METER_SERVICE_PASSWORD: ${FILEGRID_USER_CONTOR_PASSWORD:-}
    networks:
      - storage-net
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
  # ---------------------------------------------------------------------------------------------------------------
  # Toxiproxy (F9, chaos profile): degraded network. Starts only with
  #   docker compose --profile chaos up -d toxiproxy
  # Without the profile the stack is unchanged (api talks to storage directly). Ports ONLY on 127.0.0.1:
  #   8474 = control API; 8443 = client -> nginx proxy (created at runtime through the API, name "nginx":
  #   listen 0.0.0.0:8443 -> upstream nginx:443; the browser/k6 use https://localhost:8443).
  # Storage proxies (tests/chaos/toxiproxy.json): s3 -> minio:9000 (19000) and storage-db -> mssql:1433
  # (11433), on storage-net only; api goes through them only with infra/docker/docker-compose.chaos.yml.
  # No depends_on: it never starts or changes the rest of the stack.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["chaos"]
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ../../tests/chaos/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8443:8443"
    networks:
      - public
      - storage-net
    healthcheck:
      # The image has no shell; toxiproxy-cli list queries the local API (localhost:8474).
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s
    mem_limit: 64m

networks:
  # Internal: storage backends, api and observability. No published ports and no egress.
  storage-net:
    internal: true
  # Public: only nginx (and toxiproxy in the chaos profile, on 127.0.0.1).
  public: {}

volumes:
  mssql:
  mssql-storage:
  minio:
  ftp:
  nginx-certs:
  grafana:
  prometheus:
  minio-metrics-auth:
  alertmanager:
  loki:
  api-logs:
  promtail-positions:

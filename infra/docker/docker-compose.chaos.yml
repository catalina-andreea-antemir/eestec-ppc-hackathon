# Override for the chaos tests (F9), enabled explicitly from the repo root together with the chaos profile:
#   docker compose --profile chaos up -d toxiproxy
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.chaos.yml up -d --no-deps api
# Back to normal (api talks to storage directly again, toxiproxy stopped):
#   docker compose up -d --no-deps api
#   docker compose --profile chaos rm -sf toxiproxy
# The tests/chaos scripts do this themselves (scenario d).
#
# Only S3 and FileGridStorage go through toxiproxy; FileGridMeta stays direct (metadata is not the target),
# and so does FTP (passive mode would need one proxy per data port 21000-21049).
# With the split profile (STORAGE_DB_HOST=mssql-storage), the storage-db upstream in tests/chaos/toxiproxy.json
# becomes mssql-storage:1433.

services:
  api:
    environment:
      S3_ENDPOINT: http://toxiproxy:19000
      STORAGE_DB_URL: "jdbc:sqlserver://toxiproxy:11433;databaseName=FileGridStorage;encrypt=true;trustServerCertificate=true;responseBuffering=adaptive"
    depends_on:
      toxiproxy:
        condition: service_healthy

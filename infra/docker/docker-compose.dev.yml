# Development override (ADR-002), enabled explicitly from the repo root:
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.dev.yml up -d
# Publishes ports ONLY on 127.0.0.1 (nothing reachable from the network):
#   127.0.0.1:1433  SQL Server (SSMS / Azure Data Studio; login sa or filegrid_*_app, passwords in .env)
#   127.0.0.1:9000  MinIO S3 API
#   127.0.0.1:9001  MinIO console (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD from .env)
#   127.0.0.1:21 and 127.0.0.1:21000-21049  FTP (control + passive ports; vsftpd advertises 127.0.0.1 in PASV, see FTP_PASV_ADDRESS)
#
# Services live on storage-net, which is internal, and Docker does not publish ports from an internal network;
# that is why the services below also join dev-net (a plain bridge), used only for these ports.
# api publishes no ports even here, so `--scale api=3` keeps working.

services:
  mssql:
    ports:
      - "127.0.0.1:1433:1433"
    networks:
      - storage-net
      - dev-net

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - storage-net
      - dev-net

  ftp:
    environment:
      # Dev only: address vsftpd advertises in the PASV reply, so data goes through the published ports.
      FTP_PASV_ADDRESS: 127.0.0.1
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:21000-21049:21000-21049"
    networks:
      - storage-net
      - dev-net

networks:
  dev-net: {}

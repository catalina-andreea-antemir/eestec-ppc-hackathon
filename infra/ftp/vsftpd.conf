# vsftpd for FileGrid (C6). A single local user (the app's), chrooted to /srv/ftp.
listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
# Only the app user may log in (list written by the entrypoint).
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd/user_list

# Passive mode. No pasv_address: vsftpd replies with the container IP on storage-net, which api reaches directly.
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21049
port_enable=NO
connect_from_port_20=NO

# Atomic rename (RNFR/RNTO) and resume (REST) are on by default; no per-IP client limits,
# since every request comes from the 1-3 api instances.
max_clients=200
max_per_ip=0
idle_session_timeout=600
data_connection_timeout=300

# Inside a container: no separate namespaces (would need CAP_SYS_ADMIN) and no seccomp sandbox.
isolate=NO
isolate_network=NO
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Transfer logs disabled: vsftpd cannot open /dev/stdout after dropping privileges
# (500 OOPS). Operations are measured and logged by api instead.
xferlog_enable=NO

# vsftpd pentru FileGrid (C6). Un singur utilizator local (al aplicatiei), inchis in /srv/ftp.
listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
# Doar utilizatorul aplicatiei are voie sa se autentifice (lista scrisa de entrypoint).
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd/user_list

# Mod pasiv. Fara pasv_address: vsftpd raspunde cu IP-ul containerului din storage-net, la care api ajunge direct.
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21049
port_enable=NO
connect_from_port_20=NO

# Redenumire atomica (RNFR/RNTO) si reluare (REST) sunt active implicit; fara limite de clienti per IP,
# pentru ca toate cererile vin de la cele 1-3 instante api.
max_clients=200
max_per_ip=0
idle_session_timeout=600
data_connection_timeout=300

# In container: fara namespace-uri separate (ar cere CAP_SYS_ADMIN) si fara sandbox seccomp.
isolate=NO
isolate_network=NO
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Loguri de transfer dezactivate: vsftpd nu poate deschide /dev/stdout dupa ce isi schimba utilizatorul
# (500 OOPS). Operatiile se masoara si se logheaza in api.
xferlog_enable=NO

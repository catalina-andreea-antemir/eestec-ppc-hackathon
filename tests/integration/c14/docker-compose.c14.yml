# C14 - override for the scaling test, in an ISOLATED Docker project (filegrid-c14): volumes, networks and
# containers separate from the main stack (filegrid). Not used directly; run.sh starts it:
#   docker compose -p filegrid-c14 --env-file tests/integration/c14/.env.c14 \
#     -f docker-compose.yml -f tests/integration/c14/docker-compose.c14.yml up -d --build --scale api=3 nginx api
# Only nginx, api (3 replicas) and their dependencies (mssql, mssql-init, minio, minio-init, ftp, api-logs-init);
# no observability, so it fits next to the main stack in 8 GB.

services:
  nginx:
    # The main stack holds 80/443; here only HTTPS, on 127.0.0.1.
    ports: !override
      - "127.0.0.1:${C14_HTTPS_PORT:-18443}:443"

  api:
    environment:
      # ADR-003 requirement: memory must not grow with file size; fixed 256 MB heap.
      JAVA_OPTS: "-Xmx256m -XX:+ExitOnOutOfMemoryError"

  mssql:
    environment:
      MSSQL_MEMORY_LIMIT_MB: "1024"
    mem_limit: 1536m
